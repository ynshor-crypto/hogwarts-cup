      $('#chIcon').textContent = TYPES[type].icon;
      $('#chLabel').textContent = TYPES[type].label;
      $('#chPrompt').innerHTML = promptHtml;
      $('#chOptions').innerHTML = opts.map((o, i) => `<button class="opt" data-i="${i}" dir="ltr">${o.html}</button>`).join('');
      $('#chOptions').dataset.n = opts.length;
      box.hidden = false;
      box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');
      if (!said.has(type)) { said.add(type); sayHe(TYPES[type].label); }

      let t0 = performance.now(), answered = false;
      const speakPrompt = (slow) => speakEn(w.en, slow ? 0.5 : 0.85);
      if (type === 'listen' || type === 'hear2word' || type === 'letter') {
        setTimeout(() => speakPrompt().then(() => (t0 = performance.now())), said.size === 1 && type !== 'letter' ? 1400 : 250);
      }
      $('#chPrompt').onclick = (e) => {
        const b = e.target.closest('[data-say]');
        if (b) { audio(); speakPrompt(b.dataset.say === 'slow'); }
      };
      $('#chOptions').onclick = async (e) => {
        const b = e.target.closest('.opt');
        if (!b || answered) return;
        answered = true;
        audio();
        const ms = performance.now() - t0;
        const o = opts[+b.dataset.i];
        const okBtn = $('#chOptions').children[opts.findIndex((x) => x.ok)];
        okBtn.classList.add('ok');
        const reveal = `<b dir="ltr">${esc(w.en)}</b> = ${esc(w.he)} ${isImg(w.emoji) ? '' : esc(w.emoji || '')}`;
        if (o.ok) {
          sfx('correct');
          toast(reveal, 1600);
          if (type === 'read' || type === 'pic2word' || type === 'letter') speakEn(w.en);
          await sleep(650);
          box.hidden = true;
          resolve({ correct: true, ms });
        } else {
          b.classList.add('no');
          sfx('wrong');
          toast(reveal, 2600);
          await speakEn(w.en);
          sayHe(w.he);
          await sleep(1100);
          box.hidden = true;
          resolve({ correct: false, ms });
        }
      };
    });
  }

  // ================= כיוון בעיטה (החלקה או נגיעה) =================
  function getAim() {
    return new Promise((resolve) => {
      const el = $('#aim');
      el.hidden = false;
      let start = null, done = false;
      const finish = (pt) => {
        if (done) return;
        done = true;
        el.hidden = true;
        el.onpointerdown = el.onpointerup = null;
        clearInterval(timer);
        const s = Pitch.goalToScreen(pt.x, pt.y);
        const mk = $('#aimMark');
        mk.style.left = s.x + 'px'; mk.style.top = s.y + 'px';
        mk.classList.remove('show'); void mk.offsetWidth; mk.classList.add('show');
        resolve(pt);
      };
      el.onpointerdown = (e) => { start = { x: e.clientX, y: e.clientY }; };
      el.onpointerup = (e) => {
        if (!start) return;
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        if (Math.hypot(dx, dy) > 30) {
          const W = window.innerWidth, H = window.innerHeight;
          const gx = Math.max(-1, Math.min(1, dx / (W * 0.22))) * (Pitch.GW / 2 - 0.5);
          const gy = Math.max(0.35, Math.min(Pitch.GH - 0.35, 0.5 + (-dy / (H * 0.35)) * 1.8));
          finish({ x: gx, y: gy });
        } else {
          finish(Pitch.screenToGoal(e.clientX, e.clientY));
        }
      };
      // בעיטה אוטומטית אם לא נגעו: לא מתקעים את המשחק
      let left = 7;
      const timer = setInterval(() => {
        if (paused) return;
        if (--left <= 0) finish({ x: pick([-1, 1]) * rand(1.6, 3), y: rand(0.6, 2) });
      }, 1000);
    });
  }

  // ================= משחק =================
  let M = null, paused = false;
  const ABORT = Symbol('abort');
  const alive = (m) => { if (M !== m || m.aborted) throw ABORT; };

  function nextWord() {
    const w = M.queue.shift();
    M.queue.push(w);
    return w;
  }
  function requeue(w, correct) {
    const i = M.queue.lastIndexOf(w);
    if (i >= 0) M.queue.splice(i, 1);
    if (correct) M.queue.push(w); else M.queue.splice(Math.min(2, M.queue.length), 0, w);
  }
  function answer(w, r) {
    const first = !M.tried.has(w.key);
    M.tried.add(w.key);
    const ev = record(w, r.correct, first);
    if (ev === 'mastered') M.mastered.push(w);
    const pw = (M.perWord[w.key] = M.perWord[w.key] || [0, 0]);
    r.correct ? (pw[0]++, M.right++) : (pw[1]++, M.wrong++);
    requeue(w, r.correct);
    if (r.correct) { M.streak++; addCoins(1); } else M.streak = 0;
    persist();
  }

  async function giveItem(m) {
    if (M.item) { addCoins(2); return; }
    const s = $('#itemSlot');
    const ids = Object.keys(ITEMS);
    s.classList.add('spin');
    for (let i = 0; i < 12; i++) { s.textContent = ITEMS[ids[i % ids.length]].emoji; sfx('tick'); await sleep(70 + i * 8); alive(m); }
    s.classList.remove('spin');
    M.item = pick(ids);
    sfx('item');
    updateItemSlot();
    toast(`${ITEMS[M.item].emoji} <b>${ITEMS[M.item].name}</b><br><small>${ITEMS[M.item].tip} לוחצים עליו כדי להפעיל</small>`, 2800);
    sayHe(ITEMS[M.item].name);
  }

  async function attackPlay(m, bonus = false) {
    await Pitch.attackSetup(); alive(m);
    const w = nextWord();
    const turbo = M.armed === 'broom';
    const r = await ask(w, turbo ? 2 : 3); alive(m);
    if (turbo) { M.armed = null; updateItemSlot(); }
    answer(w, r);
    updateScore();
    if (!r.correct) {
      await Pitch.fumble(); alive(m);
      banner(`🐺 ${settings().fetchDog} החזיר את הכדור!`, 'soft');
      await sleep(500);
      return;
    }
    const power = turbo || r.ms < 3500 ? 2 : 1;
    Pitch.charge(true);
    if (power > 1) banner('⚡ בעיטת על!', 'gold');
    if (M.streak && M.streak % 3 === 0) giveItem(m).catch(() => {});
    const aim = await getAim(); alive(m);
    const wand = M.armed === 'wand';
    let outcome = 'goal';
    if (!wand && !bonus) {
      const corner = Math.abs(aim.x) > 2.3 || aim.y > 1.8 ? 0.06 : 0;
      const p = (power > 1 ? 0.9 : 0.74) + corner - difficulty();
      if (Math.random() > p) outcome = Math.random() < 0.6 ? 'save' : 'post';
    }
    await Pitch.shoot({ tx: aim.x, ty: aim.y, outcome, power, curve: wand }); alive(m);
    Pitch.charge(false);
    if (wand) { M.armed = null; updateItemSlot(); }
    if (outcome === 'goal') {
      if (bonus) { addCoins(2); banner('🎯 GOAL!', 'gold'); await sleep(900); return; }
      const goals = M.armed === 'snitch' ? 2 : 1;
      if (M.armed === 'snitch') { M.armed = null; updateItemSlot(); }
      M.home += goals; S.game.goals += goals;
      addCoins(3);
      updateScore();
      banner(goals > 1 ? '✨ GOAL ×2!' : '⚽ GOAL!', 'goal');
      await Pitch.celebrateGoal(); alive(m);
    } else {
      banner(outcome === 'save' ? '🧤 השוער תפס... כמעט!' : '🥅 בקורה! כמעט!', 'soft');
      await sleep(900);
    }
  }

  async function defensePlay(m) {
    await Pitch.defenseSetup(); alive(m);
    const w = nextWord();
    const r = await ask(w, M.armed === 'broom' ? 2 : 3); alive(m);
    if (M.armed === 'broom') { M.armed = null; updateItemSlot(); }
    answer(w, r);
    updateScore();
    const dogName = settings().keeperDog;
    let outcome;
    if (r.correct) outcome = r.ms < 3000 ? 'clear' : 'save';
    else if (M.armed === 'protego') { outcome = 'save'; M.armed = null; updateItemSlot(); banner('🛡️ פרוטגו!', 'gold'); }
    else outcome = Math.random() < 0.45 + difficulty() ? 'goal' : 'post';
    if (r.correct && M.streak && M.streak % 3 === 0) giveItem(m).catch(() => {});
    await Pitch.oppShoot(outcome); alive(m);
    if (outcome === 'goal') { M.away++; updateScore(); banner('😮 גול ליריב', 'soft'); }
    else if (outcome === 'post') banner('🥅 בקורה! איזה מזל!', 'soft');
    else banner(outcome === 'clear' ? `🐕 ${dogName} תפס והרחיק!` : `🐕 ${dogName} עצר!`, 'goal');
    await sleep(700);
  }

  async function introWords(m, fresh) {
    if (!fresh.length) return;
    for (let i = 0; i < fresh.length; i++) {
      const w = fresh[i];
      introduce(w);
      await new Promise((resolve) => {
        openSheet(`
          <div class="newcard">
            <div class="nc-top">🆕 קלף חדש בקבוצה! <span>${i + 1}/${fresh.length}</span></div>
            <div class="nc-pic">${picHtml(w)}</div>
            <div class="nc-en" dir="ltr">${esc(w.en)}</div>
            <div class="nc-he">${esc(w.he)}</div>
            ${w.sentence ? `<div class="nc-sent" dir="ltr">${esc(w.sentence)}</div>` : ''}
            <div class="btns">
              <button class="round big" data-a="say" aria-label="השמע">🔊</button>
              <button class="round big" data-a="slow" aria-label="לאט">🐢</button>
              ${w.sentence ? '<button class="round big" data-a="sent" aria-label="משפט">💬</button>' : ''}
              <button class="go" data-a="next">✔ הבא</button>
            </div>
          </div>`, 'card-sheet', (a) => {
          if (a === 'say') speakEn(w.en);
          if (a === 'slow') speakEn(w.en, 0.5);
          if (a === 'sent') speakEn(w.sentence, 0.8);
          if (a === 'next') { closeSheet(); resolve(); }
        });
        sfx('card');
        speakEn(w.en).then(() => sayHe(w.he));
      });
      alive(m);
    }
    persist();
  }

  async function startMatch() {
    audio();
    closeSheet();
    const st = settings();
    const opp = league()[S.game.stage] || 'slytherin';
    const { pool, fresh } = buildPool();
    const m = (M = {
      opp, half: 1, play: 0, plays: Math.max(4, Math.min(30, st.playsPerHalf | 0)), home: 0, away: 0,
      queue: [], tried: new Set(), perWord: {},
      streak: 0, item: null, armed: null, right: 0, wrong: 0, coins: 0, mastered: [], fresh,
      start: Date.now(), aborted: false,
    });
    // מילים חדשות קודם, ואחריהן השאר (כדי שיופיעו מוקדם, כל עוד הן טריות בזיכרון)
    M.queue = fresh.concat(shuffle(pool.filter((w) => !fresh.includes(w))));
    Pitch.setTeams(st.house, opp);
    applyLook();
    setMode('match');
    $('#homeName').textContent = HOUSE_INFO[st.house].crest;
    $('#awayName').textContent = HOUSE_INFO[opp].crest;
    updateScore(); updateItemSlot();
    try {
      await introWords(m, fresh);
      setAmbience(true);
      sfx('whistle');
      banner(`${HOUSE_INFO[st.house].he} נגד ${HOUSE_INFO[opp].he}`, 'gold');
      for (M.half = 1; M.half <= 2; M.half++) {
        M.play = 0; updateScore();
        const pattern = ['A', 'A', 'D'];
        for (; M.play < M.plays; ) {
          const kind = pattern[M.play % 3];
          if (kind === 'A') await attackPlay(m); else await defensePlay(m);
          M.play++; updateScore();
        }
        if (M.half === 1) await halftime(m);
      }
      sfx('whistle');
      await finishMatch(m);
    } catch (e) {
      if (e !== ABORT) throw e;
    }
  }

  async function halftime(m) {
    sfx('whistle');
    setAmbience(false);
    await sleep(600); alive(m);
    await new Promise((resolve) => {
      openSheet(`
        <div class="big">⏸️ מחצית!</div>
        <div class="bigscore">${crest(settings().house)} <b>${M.home}</b> : <b>${M.away}</b> ${crest(M.opp)}</div>
        <p class="sub">🎯 בונוס: 3 פנדלים מהירים. כל גול = 🪙2</p>
        <div class="btns"><button class="go" data-a="go">▶ לבונוס!</button></div>`, '', (a) => { if (a === 'go') { closeSheet(); resolve(); } });
    });
    alive(m);
    await KidsLearn.show(); alive(m);
    for (let i = 0; i < 3; i++) await attackPlay(m, true);
    setAmbience(true);
    sfx('whistle');
    banner('מחצית שנייה!', 'gold');
  }

  const TALK = [
    'תגיד לאמא שלוש מילים באנגלית שלמדת היום!',
    'אם ברטי היה יכול לדבר אנגלית, מה הוא היה אומר?',
    'איזו מילה הייתה הכי קשה היום? בוא נגיד אותה יחד באנגלית.',
    'איך אומרים באנגלית את השם של המשחק האהוב עליך?',
    'איזה קלף זהב הכי שווה בארון שלך? למה?',
  ];

  async function finishMatch(m) {
    setAmbience(false);
    const st = settings();
    const win = M.home > M.away, draw = M.home === M.away;
    const minutes = Math.round((Date.now() - M.start) / 6000) / 10;
    S.game.matches++;
    let cupWon = false;
    if (win) {
      S.game.wins++;
      S.game.stage++;
      if (S.game.stage >= league().length) { cupWon = true; S.game.stage = 0; S.game.season++; }
    }
    addCoins(win ? (cupWon ? 50 : 10) : 4);
    const d = new Date();
    const hard = Object.entries(M.perWord).filter(([, v]) => v[1] > 0).map(([k]) => k);
    const session = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: dayStr(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, minutes,
      score: `${M.home}–${M.away}`, opponent: HOUSE_INFO[M.opp].he, right: M.right, wrong: M.wrong,
      newWords: M.fresh.map((w) => w.en), hardWords: hard, words: Object.keys(M.perWord),
    };
    S.sessions.push(session);
    S.sessions = S.sessions.slice(-80);
    S.pending.push(session);
    S.dirty = true;
    persist();
    pushNow();

    Pitch.endSetup();
    setMode('end');
    sfx(win ? 'win' : 'crowd');
    const cards = [...M.mastered.map((w) => ({ w, tier: 'gold' })), ...M.fresh.filter((w) => !M.mastered.includes(w)).map((w) => ({ w, tier: 'bronze' }))];
    const title = cupWon ? '🏆 זכית בגביע!' : win ? 'ניצחון! 🎉' : draw ? 'תיקו! 🤝' : 'איזה משחק! 💪';
    const sub = cupWon ? `${st.playerName || 'הקבוצה'} אלוף העונה! מתחילה עונה ${S.game.season}` : win ? 'עלית שלב בליגה!' : 'עוד משחק כזה ומנצחים. המילים שלמדת נשמרו!';
    openSheet(`
      <div class="trophy">${cupWon ? '🏆' : win ? '🥇' : '⚽'}</div>
      <div class="big">${title}</div>
      <div class="bigscore">${crest(st.house)} <b>${M.home}</b> : <b>${M.away}</b> ${crest(M.opp)}</div>
      <p class="sub">${sub}</p>
      <div class="stats"><span>✅ ${M.right}</span><span>🪙 +${M.coins}</span><span>⏱️ ${minutes} דק׳</span></div>
      ${cards.length ? `<div class="newcards"><div class="lbl">${M.mastered.length ? '🌟 קלפי זהב חדשים!' : '🃏 קלפים חדשים'}</div><div class="cardrow">${cards.map(({ w, tier }) => cardHtml(w, tier)).join('')}</div></div>` : ''}
      <p class="talk">💬 ${pick(TALK)}</p>
      <div class="btns"><button class="go" data-a="again">⚽ עוד משחק</button><button class="ghost" data-a="home">🏠 לתפריט</button></div>`, 'end-sheet', (a, el) => {
      if (a === 'again') startMatch();
      if (a === 'home') goHome();
      if (a === 'card') speakEn(el.dataset.en);
    });
    if (M.mastered.length) setTimeout(() => sfx('card'), 900);
    await sleep(1600);
    if (M === m) KidsLearn.show();
  }

  function goHome() {
    if (M) M.aborted = true;
    M = null;
    paused = false;
    Pitch.setPaused(false);

    $('#challenge').hidden = true;
    $('#aim').hidden = true;

    applyLook();
    setMode('menu');
    renderMenu();
  }

  function setPaused(p) {
    paused = p;
    Pitch.setPaused(p);
    if (p && 'speechSynthesis' in window) speechSynthesis.cancel();
  }

  // ================= ארון קלפים =================
  function tierOf(p) {
    if (!p || !p.seen) return 'locked';
    if (p.mastered) return 'gold';
    if (p.box >= 3) return 'silver';
    return 'bronze';
  }
  function cardHtml(w, tier) {
    if (tier === 'locked') return `<button class="wcard locked" aria-label="קלף נעול"><span class="q">?</span></button>`;
    return `<button class="wcard ${tier}" data-a="card" data-en="${esc(w.en)}" data-he="${esc(w.he)}"><span class="pic">${picHtml(w)}</span><span class="en" dir="ltr">${esc(w.en)}</span><span class="hb">${esc(w.he)}</span></button>`;
  }
  let cardsPack = 'all';
  function openCards() {
    const words = allWords();
    const packs = [...new Set(words.map((w) => w.pack))];
    const list = cardsPack === 'all' ? words : words.filter((w) => w.pack === cardsPack);
    const order = { gold: 0, silver: 1, bronze: 2, locked: 3 };
    const sorted = list.map((w) => ({ w, t: tierOf(S.words[w.key]) })).sort((a, b) => order[a.t] - order[b.t]);
    const gold = words.filter((w) => tierOf(S.words[w.key]) === 'gold').length;
    openSheet(`
      <div class="sheet-head"><h2>🃏 ארון הקלפים</h2><span class="pill">🌟 ${gold}/${words.length}</span><button class="round" data-a="close" aria-label="סגירה">✖</button></div>
      <p class="hint">🥉 חדש · 🥈 כמעט · 🥇 זהב = ידעת ב-3 ימים שונים. לוחצים על קלף כדי לשמוע.</p>
      <div class="tabs">${['all', ...packs].map((p) => `<button class="chip ${p === cardsPack ? 'on' : ''}" data-a="pack" data-p="${esc(p)}">${p === 'all' ? 'הכול' : esc(p)}</button>`).join('')}</div>
      <div class="cardgrid">${sorted.map(({ w, t }) => cardHtml(w, t)).join('')}</div>`, 'panel-sheet', (a, el) => {
      if (a === 'close') closeSheet();
      if (a === 'pack') { cardsPack = el.dataset.p; openCards(); }
      if (a === 'card') { el.classList.toggle('flip'); speakEn(el.dataset.en); }
    });
  }

  // ================= חנות =================
  function openShop() {
    const items = SHOP();
    const e = S.game.equip;
    openSheet(`
      <div class="sheet-head"><h2>🛒 החנות של דיאגון</h2><span class="pill">🪙 ${S.game.coins}</span><button class="round" data-a="close" aria-label="סגירה">✖</button></div>
      <p class="hint">קונים פעם אחת, ואז לוחצים כדי ללבוש או להוריד.</p>
      <div class="shopgrid">${items.map((it) => {
        const owned = S.game.owned.includes(it.id);
        const on = owned && (it.val ? e[it.slot] === it.val : !!e[it.slot]);
        const can = S.game.coins >= it.price;
        return `<button class="shopitem ${owned ? 'owned' : ''} ${on ? 'on' : ''} ${!owned && !can ? 'cant' : ''}" data-a="item" data-id="${it.id}">
          <span class="emo">${it.emoji}</span><span class="nm">${esc(it.name)}</span>
          <span class="pr">${on ? '✔ לבוש' : owned ? 'ללבוש' : '🪙 ' + it.price}</span></button>`;
      }).join('')}</div>`, 'panel-sheet shop-sheet', (a, el) => {
      if (a === 'close') { closeSheet(); return; }
      if (a !== 'item') return;
      const it = items.find((x) => x.id === el.dataset.id);
      if (!S.game.owned.includes(it.id)) {
        if (S.game.coins < it.price) { toast(`עוד ${it.price - S.game.coins} 🪙 וזה שלך!`); sfx('wrong'); return; }
        S.game.coins -= it.price;
        S.game.owned.push(it.id);
        sfx('item');
        e[it.slot] = it.val || true;
      } else {
        const on = it.val ? e[it.slot] === it.val : !!e[it.slot];
        if (on) delete e[it.slot]; else e[it.slot] = it.val || true;
      }
      S.dirty = true;
      persist();
      applyLook();
      updateCoins();
      openShop();
    });
  }

  // ================= מסך הורים =================
  function parentGate() {
    const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
    openSheet(`
      <div class="sheet-head"><h2>🔒 להורים</h2><button class="round" data-a="close" aria-label="סגירה">✖</button></div>
      <p class="sub">כמה זה ${a} × ${b}?</p>
      <input id="gateIn" class="gate" inputmode="numeric" autocomplete="off" />
      <div class="btns"><button class="go" data-a="ok">כניסה</button></div>`, 'panel-sheet small', (act) => {
      if (act === 'close') closeSheet();
      if (act === 'ok') {
        if (+$('#gateIn').value === a * b) openParents('progress');
        else { $('#gateIn').value = ''; $('#gateIn').classList.add('shake'); setTimeout(() => $('#gateIn').classList.remove('shake'), 400); }
      }
    });
    setTimeout(() => $('#gateIn') && $('#gateIn').focus(), 100);
    $('#gateIn').onkeydown = (e) => { if (e.key === 'Enter') sheetHandler('ok'); };
  }

  function statsSummary() {
    const words = allWords();
    const t = today(), weekAgo = addDays(t, -6);
    const sess = S.sessions;
    const minToday = sess.filter((s) => s.date === t).reduce((a, s) => a + s.minutes, 0);
    const minWeek = sess.filter((s) => s.date >= weekAgo).reduce((a, s) => a + s.minutes, 0);
    const vals = words.map((w) => ({ w, p: S.words[w.key] }));
    const mastered = vals.filter((v) => v.p && v.p.mastered).length;
    const learning = vals.filter((v) => v.p && v.p.seen && !v.p.mastered).length;
    const hard = vals.filter((v) => isHard(v.p));
    return { words, vals, minToday: Math.round(minToday), minWeek: Math.round(minWeek), mastered, learning, rest: words.length - mastered - learning, hard, games: sess.length };
  }

  let parentTab = 'progress';
  function openParents(tab = parentTab) {
    parentTab = tab;
    const st = settings();
    const tabs = `<div class="tabs">${[['progress', '📊 התקדמות'], ['sheet', '🔗 גיליון'], ['settings', '⚙️ הגדרות']].map(([k, l]) => `<button class="chip ${k === tab ? 'on' : ''}" data-a="tab" data-t="${k}">${l}</button>`).join('')}</div>`;
    let body = '';
    if (tab === 'progress') {
      const s = statsSummary();
      const status = (p) => (!p || !p.seen ? ['עוד לא', 'none'] : p.mastered ? ['נשלטה ✅', 'gold'] : isHard(p) ? ['קשה ⚠️', 'hard'] : ['בלמידה 📘', 'learn']);
      const order = { hard: 0, learn: 1, gold: 2, none: 3 };
      const rows = s.vals.map((v) => ({ ...v, st: status(v.p) })).sort((a, b) => order[a.st[1]] - order[b.st[1]]);
      body = `
        <div class="tiles">
          <div class="tile"><b>${s.minToday}</b><span>דקות היום</span></div>
          <div class="tile"><b>${s.minWeek}</b><span>דקות השבוע</span></div>
          <div class="tile"><b>${s.games}</b><span>משחקים</span></div>
          <div class="tile gold"><b>${s.mastered}</b><span>מילים נשלטו</span></div>
          <div class="tile"><b>${s.learning}</b><span>בלמידה</span></div>
          <div class="tile"><b>${s.rest}</b><span>עוד לא הגיעו</span></div>
        </div>
        <h3>⚠️ מילים קשות (כדאי לתרגל יחד)</h3>
        <p>${s.hard.length ? s.hard.map((v) => `<b dir="ltr">${esc(v.w.en)}</b> (${esc(v.w.he)})`).join(' · ') : 'אין כרגע 🎉'}</p>
        <h3>📅 משחקים אחרונים</h3>
        <table class="tbl"><tr><th>תאריך</th><th>דקות</th><th>תוצאה</th><th>✅</th><th>✗</th></tr>
        ${S.sessions.slice(-7).reverse().map((x) => `<tr><td>${x.date} ${x.time}</td><td>${x.minutes}</td><td>${x.score}</td><td>${x.right}</td><td>${x.wrong}</td></tr>`).join('') || '<tr><td colspan="5">עוד אין משחקים</td></tr>'}
        </table>
        <h3>📚 כל המילים</h3>
        <table class="tbl"><tr><th>English</th><th>עברית</th><th>מצב</th><th>שלב</th><th>✅</th><th>✗</th></tr>
        ${rows.map((r) => `<tr class="${r.st[1]}"><td dir="ltr">${esc(r.w.en)}</td><td>${esc(r.w.he)}</td><td>${r.st[0]}</td><td>${r.p && r.p.seen ? '⭐'.repeat(r.p.box) || '·' : ''}</td><td>${r.p ? r.p.right : 0}</td><td>${r.p ? r.p.wrong : 0}</td></tr>`).join('')}
        </table>`;
    } else if (tab === 'sheet') {
      const ok = Sheet.connected;
      const last = S.lastSync ? new Date(S.lastSync).toLocaleString('he-IL') : '—';
      const connectLink = ok ? location.origin + location.pathname + '#connect=' + encodeURIComponent(Sheet.url) : '';
      body = `
        <p class="status ${ok ? 'on' : ''}">${ok ? '✅ מחובר לגיליון' : '⚪ לא מחובר — הכול נשמר רק במכשיר הזה'}</p>
        ${ok ? `<p>סנכרון אחרון: ${last}${S.pending.length ? ` · ממתינים לשליחה: ${S.pending.length}` : ''}</p>
          <div class="btns">
            <button class="go" data-a="sync">🔄 סנכרן עכשיו</button>
            ${content.sheetUrl ? `<a class="ghost btnlink" href="${esc(content.sheetUrl)}" target="_blank" rel="noopener">📄 פתח את הגיליון</a>` : ''}
          </div>
          <h3>📱 לחבר מכשיר נוסף</h3>
          <p class="hint">פותחים את הקישור הזה במכשיר השני (או סורקים/שולחים בווטסאפ):</p>
          <input class="url" readonly value="${esc(connectLink)}" onclick="this.select()" />
          <div class="btns"><button class="ghost" data-a="copy">📋 העתק קישור</button><button class="ghost" data-a="disconnect">ניתוק</button></div>`
        : `<p class="hint">מדביקים כאן את קישור הסקריפט מהגיליון (בגיליון: ⚽ גביע הוגוורטס ← 🔗 קישור חיבור למשחק).</p>
          <input id="urlIn" class="url" placeholder="https://script.google.com/macros/s/.../exec" />
          <div class="btns"><button class="go" data-a="connect">🔗 חיבור</button></div>`}`;
    } else {
      body = Sheet.connected
        ? `<p class="hint">ההגדרות נקבעות בגיליון, בלשונית ⚙️ הגדרות.</p>
           <table class="tbl"><tr><td>שם</td><td>${esc(st.playerName) || '—'}</td></tr><tr><td>בית</td><td>${HOUSE_INFO[st.house].he}</td></tr>
           <tr><td>מילים חדשות בכל משחק</td><td>${st.newPerMatch}</td></tr><tr><td>מהלכים בכל מחצית</td><td>${st.playsPerHalf}</td></tr></table>`
        : `<label class="field">שם השחקן <input id="setName" value="${esc(st.playerName)}" maxlength="20" /></label>
           <div class="field">הבית <div class="tabs">${Object.keys(HOUSE_INFO).filter((h) => h !== 'durmstrang').map((h) => `<button class="chip ${h === st.house ? 'on' : ''}" data-a="house" data-h="${h}">${HOUSE_INFO[h].crest} ${HOUSE_INFO[h].he}</button>`).join('')}</div></div>
           <div class="btns"><button class="go" data-a="saveSettings">💾 שמירה</button></div>
           <p class="hint">אחרי חיבור לגיליון, ההגדרות יילקחו משם.</p>`;
      body += `<h3>📖 הסברים בכרטיסי "הידעת?"</h3><p class="hint">רמת ההסבר נבחרת באלבום 📖 (🐣/🧒/🧑).</p>`;
    }
    openSheet(`<div class="sheet-head"><h2>🔒 מסך הורים</h2><button class="round" data-a="close" aria-label="סגירה">✖</button></div>${tabs}${body}`, 'panel-sheet parents', async (a, el) => {
      if (a === 'close') { closeSheet(); renderMenu(); }
      if (a === 'tab') openParents(el.dataset.t);
      if (a === 'house') { S.localSettings.house = el.dataset.h; persist(); openParents('settings'); }
      if (a === 'saveSettings') { S.localSettings.playerName = $('#setName').value.trim(); persist(); toast('נשמר ✔'); renderMenu(); }
      if (a === 'connect') {
        const u = $('#urlIn').value.trim();
        if (!Sheet.valid(u)) { toast('הקישור צריך להתחיל ב-https://script.google.com/macros/s/ ולהסתיים ב-/exec'); return; }
        Sheet.setUrl(u);
        toast('🔄 מתחבר...');
        const ok = await syncNow();
        toast(ok ? '✅ מחובר! המילים בגיליון' : '⚠️ לא הצלחתי להתחבר. בדקו שהסקריפט פורסם לגישת "כל אחד"', 4000);
        openParents('sheet');
      }
      if (a === 'sync') { toast('🔄 מסנכרן...'); const ok = await syncNow(); toast(ok ? '✅ מסונכרן' : '⚠️ אין חיבור. ננסה שוב בפעם הבאה'); openParents('sheet'); }
      if (a === 'copy') { const i = $('.url'); i.select(); try { await navigator.clipboard.writeText(i.value); toast('הועתק ✔'); } catch (e) { document.execCommand('copy'); toast('הועתק ✔'); } }
      if (a === 'disconnect') { Sheet.setUrl(''); openParents('sheet'); renderMenu(); }
    });
  }

  // ================= סנכרון =================
  function mergeWord(a, b) {
    if (!a) return b; if (!b) return a;
    const later = (a.last || '') >= (b.last || '') ? a : b;
    return {
      box: Math.max(a.box || 0, b.box || 0), right: Math.max(a.right || 0, b.right || 0), wrong: Math.max(a.wrong || 0, b.wrong || 0),
      days: [...new Set([...(a.days || []), ...(b.days || [])])].sort(),
      last: later.last || '', due: later.due || '', lastUp: [a.lastUp || '', b.lastUp || ''].sort().pop(),
      mastered: [a.mastered, b.mastered].filter(Boolean).sort()[0] || '', seen: !!(a.seen || b.seen), he: a.he || b.he || '',
    };
  }
  function mergeRemote(r) {
    if (!r) return false;
    const before = JSON.stringify([S.words, S.game]);
    const keys = new Set([...Object.keys(S.words), ...Object.keys(r.words || {})]);
    keys.forEach((k) => (S.words[k] = mergeWord(S.words[k], (r.words || {})[k])));
    const rg = r.game || {};
    if ((rg.matches || 0) > (S.game.matches || 0)) {
      const owned = [...new Set([...(S.game.owned || []), ...(rg.owned || [])])];
      S.game = Object.assign(freshState().game, rg, { owned });
    } else {
      S.game.owned = [...new Set([...(S.game.owned || []), ...(rg.owned || [])])];
    }
    return before !== JSON.stringify([S.words, S.game]);
  }
  const exportState = () => ({ words: S.words, game: S.game, updated: Date.now() });

  let syncing = false;
  async function pushNow() {
    if (!Sheet.connected || syncing) return false;
    syncing = true;
    try {
      if (!S.pending.length) await Sheet.push(exportState(), null);
      while (S.pending.length) {
        await Sheet.push(exportState(), S.pending[0]);
        S.pending.shift();
        persist();
      }
      S.dirty = false; S.lastSync = Date.now(); persist();
      return true;
    } catch (e) {
      return false;
    } finally {
      syncing = false;
    }
  }
  async function syncNow() {
    if (!Sheet.connected) return false;
    try {
      const r = await Sheet.pull();
      if (!r.words || !r.words.length) {
        await Sheet.seed(DEFAULT_WORDS);
        r.words = DEFAULT_WORDS;
      }
      content = { settings: r.settings || {}, words: r.words, sheetUrl: r.sheetUrl || '', at: Date.now() };
      saveContent();
      const changed = mergeRemote(r.state);
      persist();
      if (!M) renderMenu();
      if (changed || S.dirty || !r.state || S.pending.length) await pushNow();
      S.lastSync = Date.now(); persist();
      return true;
    } catch (e) {
      console.warn('sync failed', e);
      return false;
    }
  }

  // ================= אתחול =================
  Pitch.init($('#view'), sfx);
  Pitch.setLook({});
  KidsLearn.init({
    gameId: 'hogwarts-cup', facts: FACTS, level: 'big',
    isMuted: () => S.muted,
    onOpen: () => setPaused(true),
    onClose: () => setPaused(false),
  });
  KidsLearn.addAlbumButton($('#tools'));

  $('#muteBtn').onclick = () => { audio(); setMuted(!S.muted); };
  $('#pauseBtn').onclick = () => {
    if (!M) return;
    setPaused(true);
    openSheet(`<div class="big">⏸️ הפסקה</div><div class="btns"><button class="go" data-a="resume">▶ ממשיכים</button><button class="ghost" data-a="home">🏠 לתפריט</button></div>`, '', (a) => {
      if (a === 'resume') { closeSheet(); setPaused(false); }
      if (a === 'home') goHome();
    });
  };
  $('#itemSlot').onclick = () => {
    if (!M || !M.item || M.armed) return;
    M.armed = M.item; M.item = null;
    sfx('item');
    banner(`${ITEMS[M.armed].emoji} ${ITEMS[M.armed].name}!`, 'gold');
    updateItemSlot();
  };
  $('#playBtn').onclick = () => { audio(); startMatch(); };
  $('#cardsBtn').onclick = () => { audio(); openCards(); };
  $('#shopBtn').onclick = () => { audio(); openShop(); };
  $('#parentsBtn').onclick = () => { audio(); parentGate(); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') setMuted(!S.muted);
    if ($('#challenge').hidden || !/^[1-3]$/.test(e.key)) return;
    const b = $('#chOptions').children[+e.key - 1];
    b && b.click();
  });
  window.addEventListener('online', () => S.pending.length && pushNow());
  document.addEventListener('visibilitychange', () => { if (document.hidden && M && !paused && $('#sheet').hidden) $('#pauseBtn').click(); });

  setMuted(!!S.muted);
  setMode('menu');
  renderMenu();
  const justConnected = Sheet.readHash();
  if (Sheet.connected) syncNow().then((ok) => justConnected && toast(ok ? '✅ המכשיר חובר לגיליון!' : '⚠️ החיבור לגיליון נכשל', 3500));
})();

</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
