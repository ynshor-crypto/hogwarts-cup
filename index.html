<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>גביע הוגוורטס</title>
  <meta name="theme-color" content="#5a1414" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="גביע הוגוורטס" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap" />
  <style>
:root {
  --red: #8e1b1b;
  --red-d: #5a1414;
  --gold: #f5c542;
  --gold-l: #ffe08a;
  --ink: #2a1a10;
  --parch: #fbf3dd;
  --parch-d: #efe0b8;
  --ok: #2fa84f;
  --no: #e0663a;
  --sheet: rgba(30, 14, 10, 0.55);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fcbff; font-family: 'Varela Round', system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; }

/* מצבים */
#app:not([data-mode="match"]) .matchonly { display: none !important; }
#app:not([data-mode="menu"]) .menuonly { display: none !important; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#topBar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
#topBar .group { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.round { width: 54px; height: 54px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); font-size: 26px; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); }
.round:active { transform: translateY(2px); box-shadow: none; }
.round.big { width: 68px; height: 68px; font-size: 32px; }
#tools .kl-btn, #tools button { pointer-events: auto; }
.pill { background: rgba(255, 255, 255, 0.92); border-radius: 30px; padding: 8px 16px; font-family: 'Secular One', sans-serif; font-size: 22px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); white-space: nowrap; }
#coins.pop { animation: pop 0.35s; }
@keyframes pop { 50% { transform: scale(1.25); } }
#scoreboard { pointer-events: none; display: flex; align-items: center; gap: 10px; background: linear-gradient(#3a1c12, #1d0d08); color: #fff; border: 3px solid var(--gold); border-radius: 18px; padding: 4px 14px; font-family: 'Secular One', sans-serif; font-size: 30px; direction: ltr; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); }
#scoreboard .team { font-size: 28px; }
#scoreboard #half { font-size: 18px; opacity: 0.85; }
#playsBar { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 50%; transform: translateX(-50%); width: min(260px, 50vw); height: 8px; background: rgba(0, 0, 0, 0.25); border-radius: 8px; overflow: hidden; }
#playsBar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.4s; margin-right: auto; }
#streak { display: flex; gap: 4px; }
#streak i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); border: 2px solid #fff; }
#streak i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
#itemSlot { font-size: 30px; }
#itemSlot.ready { background: var(--gold-l); animation: glow 1s infinite alternate; }
#itemSlot.armed { background: #b7f0c4; outline: 4px solid var(--ok); }
#itemSlot.spin { animation: spin 0.15s linear infinite; }
@keyframes glow { to { box-shadow: 0 0 18px 4px var(--gold); } }
@keyframes spin { to { transform: rotate(20deg) scale(1.08); } }

#banner { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%) scale(0.6); opacity: 0; font-family: 'Secular One', sans-serif; font-size: clamp(30px, 7vw, 64px); color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 0 24px rgba(0, 0, 0, 0.3); white-space: nowrap; transition: transform 0.25s cubic-bezier(.3, 1.6, .5, 1), opacity 0.25s; }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner.goal { color: var(--gold); font-size: clamp(44px, 11vw, 96px); }
#banner.gold { color: var(--gold-l); }
#banner.soft { font-size: clamp(24px, 5vw, 44px); }
#toast { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 80px); left: 50%; transform: translate(-50%, -16px); opacity: 0; background: var(--parch); border: 3px solid var(--gold); border-radius: 18px; padding: 10px 22px; font-size: 26px; text-align: center; transition: 0.25s; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); max-width: 92vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast small { font-size: 17px; opacity: 0.8; }
#aimMark { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 5px solid var(--gold); border-radius: 50%; opacity: 0; }
#aimMark.show { animation: mark 0.7s ease-out; }
@keyframes mark { 0% { opacity: 1; transform: scale(1.6); } 100% { opacity: 0; transform: scale(0.6); } }

/* אתגר */
#challenge { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(760px, 96vw); background: var(--parch); border: 4px solid var(--gold); border-radius: 26px; padding: 12px 16px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
#challenge.in { animation: up 0.3s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes up { from { transform: translate(-50%, 60px); opacity: 0; } }
.ch-head { display: flex; justify-content: center; gap: 8px; font-size: 20px; color: var(--red); font-weight: bold; }
#chPrompt { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 84px; margin: 6px 0 10px; }
#chPrompt .say { width: 76px; height: 76px; border-radius: 50%; background: var(--red); color: #fff; font-size: 36px; box-shadow: 0 4px 0 var(--red-d); }
#chPrompt .say.big { width: 92px; height: 92px; font-size: 44px; animation: pulse 1.4s infinite; }
#chPrompt .say.slow { width: 62px; height: 62px; font-size: 30px; background: #6b4a2a; box-shadow: 0 4px 0 #3e2a17; }
@keyframes pulse { 50% { transform: scale(1.06); } }
#chPrompt .word { font-family: 'Secular One', sans-serif; font-size: clamp(40px, 9vw, 68px); letter-spacing: 2px; direction: ltr; }
#chPrompt .word u { text-decoration: none; display: inline-block; min-width: 0.6em; border-bottom: 6px solid var(--red); color: transparent; }
#chPrompt .pic { font-size: 64px; line-height: 1; }
#chPrompt .pic.big { font-size: 84px; }
#chPrompt .pic img { height: 84px; border-radius: 12px; }
#chOptions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; direction: ltr; }
#chOptions[data-n="2"] { grid-template-columns: repeat(2, 1fr); }
.opt { min-height: 116px; background: #fff; border: 4px solid var(--parch-d); border-radius: 20px; font-size: 58px; display: grid; place-items: center; box-shadow: 0 5px 0 var(--parch-d); transition: transform 0.1s; padding: 6px; }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--parch-d); }
.opt .word { font-family: 'Secular One', sans-serif; font-size: clamp(28px, 6vw, 44px); }
.opt .letter { font-family: 'Secular One', sans-serif; font-size: 60px; }
.opt .he { font-size: 30px; direction: rtl; }
.opt img { max-height: 90px; max-width: 100%; border-radius: 10px; }
.opt.ok { background: #d9f7e0; border-color: var(--ok); box-shadow: 0 5px 0 var(--ok); animation: pop 0.35s; }
.opt.no { background: #ffe6dc; border-color: var(--no); animation: shake 0.35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

#aim { position: absolute; inset: 0; pointer-events: auto; cursor: crosshair; touch-action: none; }
.aim-hint { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.55); color: #fff; padding: 12px 26px; border-radius: 30px; font-size: 26px; white-space: nowrap; animation: pulse 1s infinite; }

/* תפריט */
#menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(max(10px, env(safe-area-inset-top)) + 64px) 16px max(20px, env(safe-area-inset-bottom)); pointer-events: none; }
#menu > * { pointer-events: auto; }
.brand { text-align: center; }
.brand h1 { margin: 0; font-family: 'Secular One', sans-serif; font-size: clamp(34px, 7vw, 64px); color: var(--gold); text-shadow: 0 4px 0 var(--red-d), 0 0 22px rgba(0, 0, 0, 0.35); line-height: 1.05; }
.brand p { margin: 6px 0 0; display: inline-block; background: rgba(255, 255, 255, 0.85); padding: 4px 16px; border-radius: 20px; font-size: 20px; }
#ladder { display: flex; align-items: center; gap: 6px; background: rgba(30, 14, 10, 0.55); padding: 10px 14px; border-radius: 22px; margin-top: auto; margin-bottom: 14px; max-width: 100%; overflow-x: auto; }
#ladder .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; opacity: 0.6; min-width: 64px; }
#ladder .step.won, #ladder .step.next { opacity: 1; }
#ladder .step.next .crest { outline: 4px solid var(--gold); animation: glow 1s infinite alternate; }
#ladder .step small { font-size: 14px; white-space: nowrap; }
#ladder .step b { position: absolute; top: -4px; left: 2px; background: var(--ok); border-radius: 50%; width: 22px; height: 22px; font-size: 14px; display: grid; place-items: center; }
#ladder .arrow { color: var(--gold); font-style: normal; font-size: 14px; }
.crest { width: 50px; height: 56px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(135deg, var(--c1) 55%, var(--c2) 55%); border-radius: 12px 12px 24px 24px; border: 2px solid rgba(255, 255, 255, 0.7); }
.go { background: linear-gradient(#ffd96a, var(--gold)); color: var(--ink); font-family: 'Secular One', sans-serif; font-size: clamp(24px, 4.6vw, 34px); padding: 14px 34px; border-radius: 40px; box-shadow: 0 6px 0 #b8861a, 0 10px 24px rgba(0, 0, 0, 0.3); }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8861a; }
#playBtn { animation: pulse 1.6s infinite; }
.menu-row { display: flex; gap: 12px; margin-top: 14px; }
.tile-btn { background: rgba(255, 255, 255, 0.94); border-radius: 22px; padding: 12px 22px; font-size: 24px; font-family: 'Secular One', sans-serif; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2); }
.tile-btn small { background: var(--gold); border-radius: 12px; padding: 0 8px; font-size: 18px; }
.tile-btn.small { padding: 12px 16px; opacity: 0.85; }
.ghost { background: rgba(255, 255, 255, 0.9); border: 3px solid var(--parch-d); font-size: 22px; padding: 12px 24px; border-radius: 30px; font-family: 'Secular One', sans-serif; text-decoration: none; color: var(--ink); display: inline-block; }

/* חלון כללי */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: var(--sheet); padding: 16px; z-index: 20; }
.overlay[hidden] { display: none; }
#sheetBody, #sheetBody2 { background: var(--parch); border: 5px solid var(--gold); border-radius: 28px; padding: 22px 24px; text-align: center; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4); animation: up2 0.3s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes up2 { from { transform: translateY(40px) scale(0.95); opacity: 0; } }
.panel-sheet #sheetBody { width: min(860px, 100%); text-align: right; }
.panel-sheet.small #sheetBody { width: min(420px, 100%); text-align: center; }
.end-sheet #sheetBody { width: min(640px, 100%); }
.big { font-family: 'Secular One', sans-serif; font-size: clamp(32px, 6vw, 48px); color: var(--red); }
.sub { font-size: 21px; margin: 8px 0; }
.trophy { font-size: 72px; animation: pop 0.8s; }
.bigscore { display: flex; justify-content: center; align-items: center; gap: 14px; font-family: 'Secular One', sans-serif; font-size: 44px; direction: ltr; margin: 8px 0; }
.stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.stats span { background: #fff; border-radius: 16px; padding: 6px 14px; font-size: 22px; }
.talk { background: #fff7d6; border-radius: 14px; padding: 10px 14px; font-size: 19px; }
.btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.sheet-head h2 { margin: 0; flex: 1; font-family: 'Secular One', sans-serif; font-size: 30px; color: var(--red); }
.hint { font-size: 17px; opacity: 0.8; margin: 6px 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip { background: #fff; border: 3px solid var(--parch-d); border-radius: 20px; padding: 8px 16px; font-size: 18px; }
.chip.on { background: var(--gold-l); border-color: var(--gold); }

/* קלף מילה חדשה */
.newcard .nc-top { font-family: 'Secular One', sans-serif; font-size: 24px; color: var(--red); display: flex; justify-content: space-between; }
.newcard .nc-top span { font-size: 18px; opacity: 0.6; }
.nc-pic { font-size: 110px; line-height: 1.2; margin-top: 6px; }
.nc-pic img { max-height: 140px; border-radius: 16px; }
.nc-pic .he { font-size: 50px; }
.nc-en { font-family: 'Secular One', sans-serif; font-size: clamp(54px, 12vw, 84px); line-height: 1; letter-spacing: 3px; }
.nc-he { font-size: 30px; margin-top: 4px; }
.nc-sent { font-size: 22px; opacity: 0.75; margin-top: 8px; }
.card-sheet #sheetBody { background: linear-gradient(160deg, #fff8e3, #f3dfa8); }

/* ארון קלפים */
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; margin-top: 8px; direction: ltr; }
.cardrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; direction: ltr; margin-top: 6px; }
.newcards .lbl { font-family: 'Secular One', sans-serif; font-size: 22px; color: var(--red); margin-top: 10px; }
.wcard { position: relative; width: 100%; min-width: 108px; max-width: 150px; aspect-ratio: 3 / 4; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18); overflow: hidden; }
.wcard .pic { font-size: 50px; line-height: 1; }
.wcard .pic img { max-width: 80px; max-height: 70px; border-radius: 8px; }
.wcard .pic .he { font-size: 24px; }
.wcard .en { font-family: 'Secular One', sans-serif; font-size: 22px; }
.wcard .hb { font-size: 18px; display: none; }
.wcard.flip .hb { display: block; }
.wcard.bronze { background: linear-gradient(160deg, #f6d5b5, #c98a55); border: 3px solid #a5683a; }
.wcard.silver { background: linear-gradient(160deg, #f4f7fa, #b7c2cc); border: 3px solid #8e9aa6; }
.wcard.gold { background: linear-gradient(160deg, #fff4b8, #f5c542 60%, #e0a420); border: 3px solid #b8861a; }
.wcard.gold::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.7) 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.6s infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.wcard.locked { background: repeating-linear-gradient(45deg, #5a4636, #5a4636 10px, #4d3b2d 10px, #4d3b2d 20px); border: 3px solid #3a2b20; }
.wcard .q { font-size: 44px; color: rgba(255, 255, 255, 0.5); font-family: 'Secular One', sans-serif; }

/* חנות */
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }
.shopitem { background: #fff; border: 3px solid var(--parch-d); border-radius: 18px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 var(--parch-d); }
.shopitem .emo { font-size: 44px; }
.shopitem .nm { font-size: 17px; min-height: 2.4em; display: grid; place-items: center; text-align: center; }
.shopitem .pr { font-family: 'Secular One', sans-serif; font-size: 19px; background: var(--gold-l); border-radius: 12px; padding: 2px 12px; }
.shopitem.owned .pr { background: #e8eef5; }
.shopitem.on { border-color: var(--ok); background: #effbf1; }
.shopitem.on .pr { background: #b7f0c4; }
.shopitem.cant { opacity: 0.55; }
.shop-sheet { background: rgba(30, 14, 10, 0.25); align-items: end; }
.shop-sheet #sheetBody { max-height: 58vh; }

/* מסך הורים */
.gate { font-size: 34px; width: 160px; text-align: center; padding: 8px; border-radius: 14px; border: 3px solid var(--parch-d); font-family: inherit; }
.gate.shake { animation: shake 0.35s; border-color: var(--no); }
.parents h3 { margin: 16px 0 6px; color: var(--red); font-size: 20px; }
.parents p { font-size: 17px; margin: 4px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.tile { background: #fff; border-radius: 16px; padding: 10px; text-align: center; box-shadow: 0 3px 0 var(--parch-d); }
.tile b { display: block; font-family: 'Secular One', sans-serif; font-size: 32px; color: var(--red); }
.tile span { font-size: 15px; }
.tile.gold { background: var(--gold-l); }
.tbl { width: 100%; border-collapse: collapse; font-size: 16px; background: #fff; border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--parch-d); text-align: right; }
.tbl th { background: var(--red); color: var(--gold-l); }
.tbl tr.hard td { background: #fff1ea; }
.tbl tr.gold td { background: #fffbe6; }
.tbl tr.none td { opacity: 0.55; }
.status { font-size: 20px; font-weight: bold; }
.status.on { color: var(--ok); }
.url { width: 100%; font-size: 15px; padding: 10px; border-radius: 12px; border: 2px solid var(--parch-d); direction: ltr; font-family: monospace; user-select: text; -webkit-user-select: text; }
.field { display: block; font-size: 18px; margin: 10px 0; }
.field input { display: block; margin-top: 4px; font-size: 22px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--parch-d); font-family: inherit; width: min(320px, 100%); }
.btnlink { font-size: 20px; }

/* מסך קטן */
@media (max-height: 560px) {
  .opt { min-height: 84px; font-size: 44px; }
  #chPrompt { min-height: 64px; margin: 2px 0 6px; }
  #chPrompt .say.big { width: 72px; height: 72px; font-size: 34px; }
  #chPrompt .pic.big { font-size: 60px; }
  #chPrompt .word { font-size: 40px; }
  .round { width: 46px; height: 46px; font-size: 22px; }
  #scoreboard { font-size: 24px; padding: 2px 10px; }
  .nc-pic { font-size: 70px; }
  .nc-en { font-size: 50px; }
  #ladder .crest { width: 40px; height: 44px; font-size: 22px; }
  .brand h1 { font-size: 34px; }
}
@media (max-width: 620px) {
  #scoreboard { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 50%; transform: translateX(-50%); font-size: 24px; gap: 8px; padding: 2px 12px; }
  #playsBar { top: calc(max(10px, env(safe-area-inset-top)) + 106px); }
  #toast { top: calc(max(10px, env(safe-area-inset-top)) + 122px); }
  #scoreboard .team { font-size: 20px; }
  #streak { display: none; }
  .opt { min-height: 96px; font-size: 46px; }
  .tile-btn { font-size: 20px; padding: 10px 16px; }
  #toast { font-size: 21px; }
}

</style>
</head>
<body>
  <div id="app" data-mode="menu">
    <div id="view"></div>

    <!-- HUD -->
    <div id="hud">
      <div id="topBar">
        <div class="group" id="tools">
          <button id="muteBtn" class="round" aria-label="השתקה">🔊</button>
          <button id="pauseBtn" class="round matchonly" aria-label="הפסקה">⏸️</button>
        </div>
        <div id="scoreboard" class="matchonly" aria-label="תוצאה">
          <span class="team" id="homeName"></span><b id="sHome">0</b>
          <span id="half">1️⃣</span>
          <b id="sAway">0</b><span class="team" id="awayName"></span>
        </div>
        <div class="group">
          <div id="streak" class="matchonly" aria-label="רצף"></div>
          <button id="itemSlot" class="round matchonly" aria-label="פריט">❔</button>
          <div id="coins" class="pill" aria-label="גליאונים">🪙 0</div>
        </div>
      </div>
      <div id="playsBar" class="matchonly"><i></i></div>
      <div id="banner"></div>
      <div id="toast" role="status"></div>
      <div id="aimMark"></div>
    </div>

    <!-- אתגר מילה -->
    <div id="challenge" hidden>
      <div class="ch-head"><span id="chIcon">👂</span><span id="chLabel"></span></div>
      <div id="chPrompt"></div>
      <div id="chOptions"></div>
    </div>

    <!-- כיוון בעיטה -->
    <div id="aim" hidden><div class="aim-hint">👆 גע בשער או החלק לבעיטה!</div></div>

    <!-- תפריט -->
    <div id="menu" class="menuonly">
      <div class="brand">
        <h1 id="title">גביע הוגוורטס</h1>
        <p id="subtitle"></p>
      </div>
      <div id="ladder" aria-label="הליגה"></div>
      <button id="playBtn" class="go">⚽ למשחק!</button>
      <div class="menu-row">
        <button id="cardsBtn" class="tile-btn">🃏 קלפים</button>
        <button id="shopBtn" class="tile-btn">🛒 חנות</button>
        <button id="parentsBtn" class="tile-btn small" aria-label="מסך הורים">🔒</button>
      </div>
    </div>

    <!-- חלון כללי: מחצית, סיום, קלפים, חנות, הורים, הפסקה -->
    <div id="sheet" class="overlay" hidden><div id="sheetBody"></div></div>

    <div id="loadError" class="overlay" hidden>
      <div id="sheetBody2"><div class="big">🛰️</div><p class="sub">צריך חיבור לאינטרנט בפעם הראשונה כדי לטעון את התלת-ממד. נסו לרענן את הדף.</p></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
// ---- shared/learn.js ----
// KidsLearn — מודול למידה משותף לכל המשחקים בסטודיו.
// כרטיסי "הידעת?" שמוקראים בקול + "אלבום גילויים" שהילד אוסף לאורך המשחק.
// קובץ JS רגיל (לא module) כדי שיעבוד גם בפתיחה ישירה של index.html (file://).
// מדריך שימוש: shared/README.md. עקרונות תוכן: context/learning-design.md.
//
// שימוש מינימלי:
//   index.html: לטעון את ../../shared/learn.js ואז facts.js (מגדיר const FACTS = [...]) לפני game.js
//   KidsLearn.init({ gameId: "my-game", facts: FACTS, isMuted: () => muted });
//   KidsLearn.addAlbumButton(document.getElementById("topBar"));
//   await KidsLearn.show();                   // בהפסקה טבעית (סוף שלב / פריט חדש)

(function () {
  "use strict";

  const LEVELS = ["little", "mid", "big"]; // 3–4, 5–7, 8–10
  const LEVEL_ICONS = { little: "🐣", mid: "🧒", big: "🧑" };
  const LEVEL_KEY = "kidslearn:level";
  const VOICE_KEY = "kidslearn:autoVoice"; // הקראה אוטומטית — משותף לכל המשחקים

  let opts = null;
  let facts = [];
  let collected = new Set();
  let level = "mid";
  let autoVoice = true;
  let openState = null; // { resolve, el } כשכרטיס/אלבום פתוח
  let albumBtn = null;
  let hebrewVoice = null;

  // ---------- אחסון (עטוף ב-try כי localStorage יכול לזרוק במצב פרטי/ארטיפקט) ----------
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { /* ממשיכים בלי שמירה */ }
  }
  const collectedKey = () => `kidslearn:${opts.gameId}:collected`;

  // ---------- הקראה בקול ----------
  let pendingText = null; // טקסט שמחכה שהקולות של הדפדפן ייטענו
  let voiceWaitTimer = null;

  function matchesLang(v) {
    // "he-IL" / "he_IL", ובחלק מהמכשירים (אנדרואיד ישן) עברית מסומנת "iw"
    const l = (v.lang || "").toLowerCase().replace("_", "-");
    const p = opts.lang.slice(0, 2).toLowerCase();
    const prefixes = p === "he" ? ["he", "iw"] : [p];
    return prefixes.some((x) => l === x || l.startsWith(x + "-"));
  }

  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter(matchesLang);
    hebrewVoice = voices.find((v) => v.localService) || voices[0] || null;
    if (hebrewVoice && pendingText) {
      const t = pendingText;
      pendingText = null;
      speakNow(t);
    }
  }

  // בכרום רשימת הקולות נטענת באיחור, ובספארי לפעמים בלי אירוע voiceschanged — בודקים שוב כמה פעמים
  function waitForVoice() {
    if (voiceWaitTimer) return;
    let tries = 0;
    voiceWaitTimer = setInterval(() => {
      pickVoice();
      if (hebrewVoice || ++tries >= 8) {
        clearInterval(voiceWaitTimer);
        voiceWaitTimer = null;
        pendingText = null;
      }
    }, 250);
  }

  // מקריאים משפט-משפט בלי סימני פיסוק בכלל: יש קולות שמקריאים "." ו-"!" בשמם ("dot"),
  // והפיצול למשפטים שומר על ההפסקה הטבעית ביניהם
  function speakNow(clean) {
    clean
      .split(/[.!?…]+/)
      .map((s) => s.replace(/[,:;"'״׳()\[\]\-–—]/g, " ").replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .forEach((sentence) => {
        const u = new SpeechSynthesisUtterance(sentence);
        u.lang = opts.lang;
        u.voice = hebrewVoice;
        u.rate = 0.9;
        u.pitch = 1.1;
        speechSynthesis.speak(u);
      });
  }

  // הקראה אוטומטית (כרטיס שנפתח, קריאות של המשחק). כבויה = שקט, אבל כפתור 🔊 בכרטיס עדיין מקריא
  function say(text) {
    if (autoVoice) speakText(text);
  }

  function speakText(text) {
    if (!text || !("speechSynthesis" in window)) return;
    if (opts && opts.isMuted && opts.isMuted()) return;
    stopSpeaking();
    const clean = text.replace(/[\p{Extended_Pictographic}️‍]/gu, "").trim();
    if (!clean) return;
    if (!hebrewVoice) pickVoice();
    // אף פעם לא מדברים בלי קול עברי: קול ברירת מחדל (אנגלי) מדלג על האותיות ומקריא רק
    // את הפיסוק ("exclamation point", "dot"). אם הקולות עוד לא נטענו — מחכים להם.
    if (!hebrewVoice) {
      pendingText = clean;
      waitForVoice();
      return;
    }
    speakNow(clean);
  }

  function stopSpeaking() {
    pendingText = null;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }

  // ---------- עזרי תוכן ----------
  function textFor(fact, lvl) {
    // אם אין טקסט לרמה המבוקשת — לוקחים את הרמה הקרובה ביותר שקיימת
    const i = LEVELS.indexOf(lvl);
    const order = [i, i - 1, i + 1, i - 2, i + 2].filter((n) => n >= 0 && n < LEVELS.length);
    for (const n of order) if (fact[LEVELS[n]]) return { text: fact[LEVELS[n]], level: LEVELS[n] };
    return { text: "", level: lvl };
  }

  function nextUncollected() {
    return facts.find((f) => !collected.has(f.id)) || null;
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function picture(fact, cls) {
    if (fact.image) return `<img class="${cls}" src="${escapeHtml(fact.image)}" alt="">`;
    return `<div class="${cls}">${escapeHtml(fact.emoji || "💡")}</div>`;
  }

  // ---------- שכבת-על (overlay) ----------
  function openOverlay(content, onClose) {
    const overlay = el("div", "kl-overlay");
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.appendChild(content);
    document.body.appendChild(overlay);
    return new Promise((resolve) => {
      openState = { el: overlay, resolve: () => { onClose && onClose(); resolve(); } };
    });
  }

  function closeOverlay() {
    if (!openState) return;
    const { el: overlay, resolve } = openState;
    openState = null;
    stopSpeaking();
    overlay.remove();
    updateAlbumBadge();
    resolve();
  }

  // מקשים בזמן שכרטיס פתוח: רווח/אנטר/Esc סוגרים, והמשחק לא מקבל אותם
  function onKey(e) {
    if (!openState) return;
    if (e.key === " " || e.key === "Enter" || e.key === "Escape") {
      e.preventDefault();
      closeOverlay();
    }
    e.stopPropagation();
  }

  // ---------- כרטיס "הידעת?" ----------
  function renderCard(fact, isNew) {
    let shown = textFor(fact, level);
    const card = el("div", "kl-card");
    card.innerHTML = `
      ${isNew ? '<div class="kl-badge" aria-hidden="true">✨ חדש! ✨</div>' : ""}
      ${picture(fact, "kl-pic")}
      ${fact.title ? `<div class="kl-title">${escapeHtml(fact.title)}</div>` : ""}
      <div class="kl-text"></div>
      <div class="kl-row">
        <button class="kl-btn kl-voice" aria-label="הקראה">${opts.isMuted && opts.isMuted() ? "🔇" : "🔊"}</button>
        <button class="kl-btn kl-more" aria-label="עוד">➕</button>
        <button class="kl-btn kl-ok" aria-label="סגירה">✔️</button>
      </div>`;
    const textEl = card.querySelector(".kl-text");
    const moreBtn = card.querySelector(".kl-more");
    const refresh = () => {
      textEl.textContent = shown.text;
      // ➕ מופיע רק אם יש רמת הסבר עמוקה יותר מזו שמוצגת
      const deeper = LEVELS.slice(LEVELS.indexOf(shown.level) + 1).some((l) => fact[l]);
      moreBtn.style.visibility = deeper ? "visible" : "hidden";
    };
    refresh();
    card.querySelector(".kl-voice").onclick = () => speakText(shown.text);
    moreBtn.onclick = () => {
      const next = LEVELS.slice(LEVELS.indexOf(shown.level) + 1).find((l) => fact[l]);
      if (!next) return;
      shown = { text: fact[next], level: next };
      refresh();
      say(shown.text);
    };
    card.querySelector(".kl-ok").onclick = closeOverlay;
    return { card, speak: () => say(shown.text) };
  }

  /**
   * מציג כרטיס עובדה. בלי id — העובדה הבאה שעוד לא נאספה (ואם הכל נאסף — אקראית).
   * מחזיר Promise שמתממש כשהכרטיס נסגר, כדי שהמשחק יוכל לחכות/להשהות.
   */
  function show(id) {
    if (!opts) throw new Error("KidsLearn.init() must be called first");
    if (openState) closeOverlay();
    let fact = id ? facts.find((f) => f.id === id) : nextUncollected();
    if (!fact) fact = facts[Math.floor(Math.random() * facts.length)];
    if (!fact) return Promise.resolve();
    const isNew = !collected.has(fact.id);
    collect(fact.id);
    const { card, speak } = renderCard(fact, isNew);
    opts.onOpen && opts.onOpen(fact);
    const p = openOverlay(card, () => opts.onClose && opts.onClose(fact));
    card.querySelector(".kl-ok").focus();
    speak();
    return p;
  }

  // ---------- אלבום גילויים ----------
  function openAlbum() {
    if (!opts) throw new Error("KidsLearn.init() must be called first");
    if (openState) closeOverlay();
    const box = el("div", "kl-card kl-album");
    const draw = () => {
      box.innerHTML = `
        <div class="kl-title">📖 ${collected.size} / ${facts.length}</div>
        <div class="kl-levels" role="group" aria-label="רמה">
          ${LEVELS.map((l) => `<button class="kl-lvl${l === level ? " on" : ""}" data-l="${l}" aria-label="${l}">${LEVEL_ICONS[l]}</button>`).join("")}
          <span class="kl-sep" aria-hidden="true"></span>
          <button class="kl-lvl kl-autoVoice${autoVoice ? " on" : ""}" aria-pressed="${autoVoice}" aria-label="הקראה אוטומטית">${autoVoice ? "🗣️" : "🤐"}</button>
        </div>
        <div class="kl-grid">
          ${facts.map((f) => collected.has(f.id)
            ? `<button class="kl-cell" data-id="${escapeHtml(f.id)}">${picture(f, "kl-cellpic")}</button>`
            : `<div class="kl-cell kl-locked" aria-hidden="true">❓</div>`).join("")}
        </div>
        <div class="kl-row"><button class="kl-btn kl-ok" aria-label="סגירה">✔️</button></div>`;
      box.querySelectorAll(".kl-lvl[data-l]").forEach((b) => (b.onclick = () => { setLevel(b.dataset.l); draw(); }));
      box.querySelector(".kl-autoVoice").onclick = () => { setAutoVoice(!autoVoice); draw(); };
      box.querySelectorAll(".kl-cell[data-id]").forEach((b) => (b.onclick = () => {
        // פותחים את הכרטיס מתוך האלבום, וחוזרים לאלבום כשסוגרים
        const fact = facts.find((f) => f.id === b.dataset.id);
        const { card, speak } = renderCard(fact, false);
        card.querySelector(".kl-ok").onclick = () => { stopSpeaking(); card.replaceWith(box); };
        box.replaceWith(card);
        speak();
      }));
      box.querySelector(".kl-ok").onclick = closeOverlay;
    };
    draw();
    opts.onOpen && opts.onOpen(null);
    const p = openOverlay(box, () => opts.onClose && opts.onClose(null));
    box.querySelector(".kl-ok").focus();
    return p;
  }

  // ---------- כפתור הקראה 🗣️/🤐 (נפרד מ-🔊 של הצלילים) ----------
  let voiceBtns = [];
  function paintVoiceButtons() {
    voiceBtns.forEach((b) => {
      b.textContent = autoVoice ? "🗣️" : "🤐";
      b.setAttribute("aria-label", autoVoice ? "כיבוי הקראה" : "הפעלת הקראה");
      b.setAttribute("aria-pressed", String(!autoVoice));
      b.classList.toggle("kl-off", !autoVoice);
    });
  }

  function addVoiceButton(parent) {
    const b = el("button", "kl-albumBtn kl-voiceBtn");
    b.type = "button";
    b.onclick = () => setAutoVoice(!autoVoice);
    (parent || document.body).appendChild(b);
    if (!parent) b.classList.add("kl-floating", "kl-floating-voice");
    voiceBtns.push(b);
    paintVoiceButtons();
    return b;
  }

  function addAlbumButton(parent) {
    // כפתור ההקראה מגיע אוטומטית לפני האלבום, כדי שיהיה בכל משחק.
    // משחק שיש לו כפתור הקראה משלו: init({ voiceButton: false }) ומחברים אותו ל-setAutoVoice.
    if (opts.voiceButton !== false && !voiceBtns.length) addVoiceButton(parent);
    albumBtn = el("button", "kl-albumBtn");
    albumBtn.setAttribute("aria-label", "אלבום גילויים");
    albumBtn.innerHTML = '📖<span class="kl-count"></span>';
    albumBtn.onclick = openAlbum;
    (parent || document.body).appendChild(albumBtn);
    if (!parent) albumBtn.classList.add("kl-floating");
    updateAlbumBadge();
    return albumBtn;
  }

  function updateAlbumBadge() {
    if (albumBtn) albumBtn.querySelector(".kl-count").textContent = collected.size || "";
  }

  // ---------- מצב ----------
  function collect(id) {
    if (collected.has(id) || !facts.some((f) => f.id === id)) return false;
    collected.add(id);
    save(collectedKey(), [...collected]);
    updateAlbumBadge();
    return true;
  }

  function setAutoVoice(on) {
    autoVoice = !!on;
    save(VOICE_KEY, autoVoice);
    if (!autoVoice) stopSpeaking();
    paintVoiceButtons();
  }

  function setLevel(l) {
    if (!LEVELS.includes(l)) return;
    level = l;
    save(LEVEL_KEY, l);
  }

  function init(options) {
    opts = Object.assign({ lang: "he-IL", isMuted: null, onOpen: null, onClose: null, level: null, voiceButton: true }, options);
    if (!opts.gameId) throw new Error("KidsLearn.init: gameId is required");
    facts = (opts.facts || []).filter((f) => f && f.id);
    collected = new Set(load(collectedKey(), []).filter((id) => facts.some((f) => f.id === id)));
    // רמה: מה שההורה בחר באלבום (נשמר) > ברירת מחדל של המשחק > בינונית
    level = load(LEVEL_KEY, null) || opts.level || "mid";
    autoVoice = load(VOICE_KEY, true) !== false;
    if (!LEVELS.includes(level)) level = "mid";
    injectStyle();
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
    window.addEventListener("keydown", onKey, true);
    // ההגדרה שונתה בלשונית/משחק אחר (localStorage משותף ב-file://)
    window.addEventListener("storage", (e) => {
      if (e.key !== VOICE_KEY) return;
      autoVoice = load(VOICE_KEY, true) !== false;
      if (!autoVoice) stopSpeaking();
      paintVoiceButtons();
    });
    updateAlbumBadge();
  }

  // ---------- עיצוב (מוזרק, כדי שהמודול יהיה קובץ אחד) ----------
  function injectStyle() {
    if (document.getElementById("kidslearn-style")) return;
    const s = document.createElement("style");
    s.id = "kidslearn-style";
    s.textContent = `
.kl-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:rgba(40,30,80,.55);padding:16px;direction:rtl;font-family:"Segoe UI",system-ui,sans-serif}
.kl-card{background:#fffaf0;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:24px 20px;
  width:min(92vw,520px);max-height:92vh;overflow:auto;text-align:center;color:#2b2140;
  animation:kl-pop .35s ease-out}
.kl-badge{display:inline-block;background:#ffd60a;color:#5a3d00;font-weight:800;font-size:1.3rem;
  padding:4px 16px;border-radius:999px;margin-bottom:8px}
.kl-pic{font-size:6.5rem;line-height:1.1;margin:4px auto 8px;max-width:70%;max-height:220px;display:block;object-fit:contain}
.kl-title{font-size:1.8rem;font-weight:800;margin-bottom:8px}
.kl-text{font-size:1.7rem;line-height:1.45;font-weight:600;margin:4px 6px 18px}
.kl-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.kl-btn{width:84px;height:84px;border-radius:50%;border:none;font-size:2.4rem;cursor:pointer;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.kl-btn.kl-ok{background:#8ee39b;width:100px;height:100px;font-size:3rem}
.kl-btn:active,.kl-cell:active,.kl-lvl:active,.kl-albumBtn:active{transform:scale(.94)}
.kl-btn:focus-visible,.kl-cell:focus-visible,.kl-lvl:focus-visible{outline:5px solid #6c5ce7;outline-offset:3px}
.kl-levels{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.kl-lvl{font-size:2rem;width:64px;height:64px;border-radius:18px;border:3px solid transparent;background:#fff;
  cursor:pointer;opacity:.5;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.kl-lvl.on{opacity:1;border-color:#6c5ce7}
.kl-sep{width:3px;border-radius:2px;background:#ddd;margin:6px 4px}
.kl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-bottom:18px}
.kl-cell{aspect-ratio:1;border-radius:20px;border:none;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.14);
  display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;padding:6px;overflow:hidden}
.kl-cellpic{font-size:3.2rem;max-width:100%;max-height:100%;object-fit:contain}
.kl-locked{background:#e8e4f3;color:#9b93b5;cursor:default;box-shadow:none}
.kl-albumBtn{position:relative;font-size:2rem;width:60px;height:60px;border-radius:50%;border:none;background:#fff;
  cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.kl-albumBtn.kl-floating{position:fixed;bottom:16px;left:16px;z-index:50}
.kl-albumBtn.kl-floating-voice{left:86px}
.kl-voiceBtn.kl-off{background:#e8e4f3}
.kl-count{position:absolute;top:-6px;right:-6px;background:#ff6b6b;color:#fff;font-size:.95rem;font-weight:800;
  min-width:26px;height:26px;line-height:26px;border-radius:13px;padding:0 6px}
.kl-count:empty{display:none}
@keyframes kl-pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.kl-card{animation:none}}
@media (max-height:520px){.kl-pic{font-size:4rem;max-height:120px}.kl-text{font-size:1.35rem}}`;
    document.head.appendChild(s);
  }

  window.KidsLearn = {
    init,
    show,
    openAlbum,
    addAlbumButton,
    collect,
    isCollected: (id) => collected.has(id),
    say,
    stopSpeaking,
    setLevel,
    getLevel: () => level,
    setAutoVoice,
    getAutoVoice: () => autoVoice,
    addVoiceButton,
    isOpen: () => !!openState,
    progress: () => ({ count: collected.size, total: facts.length }),
    close: closeOverlay,
  };
})();

</script>
  <script>

// חיבור לגיליון Google של ההורים (Apps Script web app). בלי חיבור — הכול עובד מקומית.
// הקישור נשמר רק במכשיר (localStorage), לא בקוד שעולה לאינטרנט.
// אפשר לחבר מכשיר גם בקישור: <כתובת המשחק>#connect=<קישור הסקריפט>
const Sheet = (() => {
  const URL_KEY = 'hogcup:sheetUrl';
  let url = '';
  try { url = localStorage.getItem(URL_KEY) || ''; } catch (e) {}

  const valid = (u) => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test((u || '').trim());

  function setUrl(u) {
    url = (u || '').trim();
    try { url ? localStorage.setItem(URL_KEY, url) : localStorage.removeItem(URL_KEY); } catch (e) {}
  }

  function readHash() {
    const m = location.hash.match(/connect=([^&]+)/);
    if (!m) return false;
    const u = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname + location.search);
    if (!valid(u)) return false;
    setUrl(u);
    return true;
  }

  async function call(opts, ms) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const target = opts.method === 'POST' ? url : url + (url.includes('?') ? '&' : '?') + 'a=pull&t=' + Date.now();
      // בלי Content-Type: נשלח כ-text/plain, כך שאין preflight ו-Apps Script מקבל את הבקשה
      const r = await fetch(target, { ...opts, signal: c.signal, redirect: 'follow' });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'sheet error');
      return j;
    } finally {
      clearTimeout(t);
    }
  }

  const pull = () => call({ method: 'GET' }, 15000);
  const post = (body) => call({ method: 'POST', body: JSON.stringify(body) }, 20000);

  return {
    get url() { return url; },
    get connected() { return valid(url); },
    valid, setUrl, readHash, pull,
    seed: (words) => post({ a: 'seed', words }),
    push: (state, session) => post({ a: 'push', state, session }),
  };
})();

  const ease = {

    in: (t) => t * t,

  // ---------- כדור ----------
  const ballSkins = {};

      map: canvasTex(256, 128, (g) => {

        spots.forEach(([x, y]) => { g.beginPath(); for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 - Math.PI / 2; g.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 13); } g.fill(); });

  let ball, ballWings, ballGlow;

  function makeBall() {
    ball = new T.Mesh(new T.SphereGeometry(BALL_R, 18, 12), ballSkins.classic);

  function setBallSkin(id) {

  const lastBall = new T.Vector3();
  function rollBall() {
    const d = ball.position.clone().sub(lastBall);
    d.y = 0;
    const len = d.length();
    if (len > 0.0001 && len < 3) {
      const axis = new T.Vector3(d.z, 0, -d.x).normalize();
      ball.rotateOnWorldAxis(axis, len / BALL_R);
    }
    lastBall.copy(ball.position);
  }

  // ---------- חלקיקים (קונפטי וניצוצות) ----------
  const parts = [];
  let partGeo;
  function burst(pos, colors, n = 40, speed = 7) {
    for (let i = 0; i < n; i++) {
      const m = new T.Mesh(partGeo, new T.MeshBasicMaterial({ color: colors[i % colors.length], side: T.DoubleSide }));
      m.position.copy(pos);
      scene.add(m);
      parts.push({ m, v: new T.Vector3(rand(-1, 1) * speed * 0.6, rand(0.4, 1.2) * speed, rand(-1, 1) * speed * 0.6), life: rand(1.2, 2.2), spin: rand(4, 10) });
    }
  }
  function stepParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.v.y -= 9 * dt;
      p.v.multiplyScalar(0.985);
      p.m.position.addScaledVector(p.v, dt);
      p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * 0.7 * dt;
      if (p.life <= 0 || p.m.position.y < 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
    }
  }

  // ---------- המגרש ----------
  function buildField() {
    const tex = canvasTex(1024, 2048, (g, w, h) => {
      const X = (x) => ((x + 30) / 60) * w, Z = (z) => ((z + 52) / 104) * h, S = (v) => (v / 60) * w;
      for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? '#2e7a2b' : '#358a31'; g.fillRect(0, Z(-52 + i * 8), w, Z(8) - Z(0) + 1); }
      g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = S(0.18);
      const line = (x1, z1, x2, z2) => { g.beginPath(); g.moveTo(X(x1), Z(z1)); g.lineTo(X(x2), Z(z2)); g.stroke(); };
      const rect = (x1, z1, x2, z2) => { line(x1, z1, x2, z1); line(x2, z1, x2, z2); line(x2, z2, x1, z2); line(x1, z2, x1, z1); };
      rect(-25, -40, 25, 40);
      line(-25, 0, 25, 0);
      const circ = (x, z, r, a0 = 0, a1 = Math.PI * 2) => { g.beginPath(); g.ellipse(X(x), Z(z), S(r), (r / 104) * h, 0, a0, a1); g.stroke(); };
      circ(0, 0, 9.15);
      [-1, 1].forEach((s) => {
        rect(-16.5, s * 40, 16.5, s * (40 - 16.5));
        rect(-9.2, s * 40, 9.2, s * (40 - 5.5));
        g.fillStyle = '#fff';
        g.beginPath(); g.ellipse(X(0), Z(s * 29), S(0.3), (0.3 / 104) * h, 0, 0, 7); g.fill();
      });
      g.beginPath(); g.ellipse(X(0), Z(0), S(0.3), (0.3 / 104) * h, 0, 0, 7); g.fill();
    });
    const field = new T.Mesh(new T.PlaneGeometry(60, 104), new T.MeshLambertMaterial({ map: tex }));
    field.rotation.x = -Math.PI / 2;
    scene.add(field);
    const ground = new T.Mesh(new T.PlaneGeometry(600, 600), mat(0x3f7a35));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02;
    scene.add(ground);
  }

  const nets = {};
  function buildGoal(z, key) {
    const g = new T.Group();
    g.position.z = z;
    if (z < 0) g.rotation.y = Math.PI;
    const postM = mat(0xffffff);
    const r = 0.09;
    [-GW / 2, GW / 2].forEach((x) => { const p = new T.Mesh(new T.CylinderGeometry(r, r, GH, 10), postM); p.position.set(x, GH / 2, 0); g.add(p); });
    const bar = new T.Mesh(new T.CylinderGeometry(r, r, GW + r * 2, 10), postM);
    bar.rotation.z = Math.PI / 2; bar.position.set(0, GH, 0); g.add(bar);
    const net = new T.Group();
    const pts = [];
    const step = 0.4;
    for (let x = -GW / 2; x <= GW / 2 + 0.01; x += step) { pts.push(x, 0, GD, x, GH, GD); pts.push(x, GH, 0, x, GH, GD); }
    for (let y = 0; y <= GH + 0.01; y += step) { pts.push(-GW / 2, y, GD, GW / 2, y, GD); [-GW / 2, GW / 2].forEach((x) => pts.push(x, y, 0, x, y, GD)); }
    for (let d = 0; d <= GD + 0.01; d += step) { pts.push(-GW / 2, GH, d, GW / 2, GH, d); [-GW / 2, GW / 2].forEach((x) => pts.push(x, 0, d, x, GH, d)); }
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
    net.add(new T.LineSegments(geo, new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })));
    g.add(net);
    nets[key] = net;
    scene.add(g);
  }
  function bulge(key) {

  }

  function buildStands() {
    const colors = Object.values(HOUSES).slice(0, 4).flatMap((h) => [h.main, h.trim]);
    const perRow = 70, rows = 4, total = perRow * rows * 2;
    const bodyGeo = new T.BoxGeometry(0.62, 0.8, 0.5), headGeo = new T.BoxGeometry(0.42, 0.42, 0.42);
    const bodies = new T.InstancedMesh(bodyGeo, new T.MeshLambertMaterial({ color: 0xffffff }), total);
    const heads = new T.InstancedMesh(headGeo, new T.MeshLambertMaterial({ color: 0xffffff }), total);
    const skins = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
    const m4 = new T.Matrix4(), col = new T.Color();
    let i = 0;
    [-1, 1].forEach((side) => {
      for (let r = 0; r < rows; r++) {
        const x = side * (31 + r * 1.6), y = 0.8 + r * 1.1;
        const step = box(1.6, 0.4, 84, 0x9aa3ad, x, y - 0.6, 0);
        scene.add(step);
        for (let k = 0; k < perRow; k++) {
          const z = -38 + (k / (perRow - 1)) * 76 + rand(-0.2, 0.2);
          m4.makeTranslation(x, y, z); bodies.setMatrixAt(i, m4);
          m4.makeTranslation(x, y + 0.62, z); heads.setMatrixAt(i, m4);
          bodies.setColorAt(i, col.setHex(colors[Math.floor(Math.random() * colors.length)]));
          heads.setColorAt(i, col.setHex(skins[Math.floor(Math.random() * skins.length)]));
          i++;
        }
      }
      for (let k = 0; k < 6; k++) {
        const h = Object.values(HOUSES)[k % 4];
        const z = -35 + k * 14;
        scene.add(box(0.15, 9, 0.15, 0x6b5844, side * 38, 4.5, z));
        const flag = box(0.05, 2.2, 3, h.main, side * 38, 7.6, z + 1.5);
        flag.add(box(0.06, 0.4, 3, h.trim, 0, -0.9, 0));
        scene.add(flag);
      }
    });
    const crowd = new T.Group();
    crowd.add(bodies, heads);
    scene.add(crowd);
    return crowd;
  }

    house.home = home; house.away = away;
    rebuildHero();
    const keep = (o, n) => { n.position.copy(o.position); n.rotation.copy(o.rotation); n.visible = o.visible; scene.remove(o); removeBlob(o); scene.add(n); return n; };
    keeper = keep(keeper, teamPerson(away, { num: '1', hair: 0x1b1b1b, skin: 0xe0ac69 }));
    striker = keep(striker, teamPerson(away, { num: '9', hair: 0x6b4423, skin: 0xffdbac }));
    dressDogs();
  }

  function setLook(c) {
    Object.keys(cos).forEach((k) => delete cos[k]);
    Object.assign(cos, c || {});
    rebuildHero();
    dressDogs();
    setBallSkin(cos.ball || 'classic');
  }

  // ---------- תנועת דמויות ----------
  function animateLimbs(o, dt) {
    const u = o.userData;
    if (u.pose) return;
    u.phase += dt * (u.kind === 'dog' ? 14 : 11) * (u.run > 0 ? 1 : 0.25);
    const sw = u.run > 0 ? Math.sin(u.phase) : 0;
    if (u.kind === 'person') {
      u.legL.rotation.x = sw * 0.9; u.legR.rotation.x = -sw * 0.9;
      u.armL.rotation.x = -sw * 0.8; u.armR.rotation.x = sw * 0.8;
      u.armL.rotation.z = 0; u.armR.rotation.z = 0;
      if (!u.run) u.torso.position.y = 1.42 + Math.sin(u.phase) * 0.015;
    } else {
      u.legs[0].rotation.x = sw * 0.8; u.legs[3].rotation.x = sw * 0.8;
      u.legs[1].rotation.x = -sw * 0.8; u.legs[2].rotation.x = -sw * 0.8;
      u.tailP.rotation.y = Math.sin(clockT * (u.wag ? 22 : 7)) * (u.wag ? 0.7 : 0.25);
      u.inner.position.y = u.run ? Math.abs(Math.sin(u.phase)) * 0.12 : 0;
    }
  }

  function faceTo(o, x, z) { o.rotation.y = Math.atan2(x - o.position.x, z - o.position.z); }
  async function runTo(o, x, z, dur, keepFace = false) {
    const sx = o.position.x, sz = o.position.z;
    if (!keepFace) faceTo(o, x, z);
    o.userData.run = 1;
    await tween(dur, (t) => { o.position.x = lerp(sx, x, t); o.position.z = lerp(sz, z, t); }, ease.lin);
    o.userData.run = 0;
  }
  function place(o, x, z, rotY) {
    o.position.set(x, 0, z);
    o.rotation.set(0, rotY, 0);
    o.userData.run = 0; o.userData.pose = false;
  }

  async function kickAnim(p) {
    const u = p.userData;
    u.pose = true;
    await tween(0.16, (t) => { u.legR.rotation.x = lerp(0, 1.1, t); u.armL.rotation.x = lerp(0, -0.6, t); });
    await tween(0.12, (t) => { u.legR.rotation.x = lerp(1.1, -1.3, t); });
    tween(0.3, (t) => { u.legR.rotation.x = lerp(-1.3, 0, t); u.armL.rotation.x = lerp(-0.6, 0, t); }).then(() => (u.pose = false));
  }

  async function cheer(p, times = 3) {
    const u = p.userData;
    u.pose = true;
    for (let i = 0; i < times; i++) {
      await tween(0.32, (t) => {
        p.position.y = Math.sin(t * Math.PI) * 0.9;
        u.armL.rotation.z = -2.7; u.armR.rotation.z = 2.7; u.armL.rotation.x = 0; u.armR.rotation.x = 0;
        u.legL.rotation.x = 0; u.legR.rotation.x = 0;
      }, ease.lin);
    }
    u.armL.rotation.z = 0; u.armR.rotation.z = 0;
    p.position.y = 0; u.pose = false;
  }

  async function dogHop(d, times = 2) {
    d.userData.wag = true;
    for (let i = 0; i < times; i++) await tween(0.28, (t) => { d.position.y = Math.sin(t * Math.PI) * 0.6; }, ease.lin);
    d.position.y = 0;
    setTimeout(() => (d.userData.wag = false), 1500);
  }

  // צידה של הטייה לעבר dx בעולם, בהתחשב בכיוון שהדמות מסתכלת אליו
  const tiltFor = (o, dx) => -Math.sign(dx || 1) * Math.sign(Math.cos(o.rotation.y) || 1);

  function divePerson(p, tx, ty, dur, reach = 1) {
    const u = p.userData;
    u.pose = true;
    const sx = p.position.x, dx = (tx - sx) * reach, roll = tiltFor(p, dx) * clamp(Math.abs(dx) / 2.2, 0.3, 1.25);
    u.armL.rotation.z = -2.8; u.armR.rotation.z = 2.8;
    return tween(dur, (t) => {
      p.position.x = sx + dx * t;
      p.position.y = Math.sin(t * Math.PI * 0.85) * clamp(ty * 0.55, 0.15, 1.3);
      p.rotation.z = roll * t;
    }, ease.out);
  }
  async function recoverPerson(p, x) {
    const u = p.userData;
    const sx = p.position.x, sr = p.rotation.z, sy = p.position.y;
    await tween(0.45, (t) => { p.position.y = lerp(sy, 0, t); p.rotation.z = lerp(sr, 0, t); p.position.x = lerp(sx, x, t); });
    u.armL.rotation.z = 0; u.armR.rotation.z = 0; u.pose = false;
  }

  // ---------- תנועת הכדור ----------
  function holdBall(obj) { ballState.holder = obj; }
  function freeBall() { ballState.holder = null; }
  function ballAt(x, z, y = BALL_R) { freeBall(); ball.position.set(x, y, z); lastBall.copy(ball.position); }

  // מסלול בזייה ריבועי מנקודה לנקודה
  function flyBall(to, dur, { arc = 0.6, curve = 0, e = ease.lin } = {}) {
    freeBall();
    const s = ball.position.clone();
    const c = s.clone().lerp(to, 0.5);
    c.y += arc; c.x += curve;
    return tween(dur, (t) => {
      const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, d = t * t;
      ball.position.set(a * s.x + b * c.x + d * to.x, a * s.y + b * c.y + d * to.y, a * s.z + b * c.z + d * to.z);
    }, e);
  }
  async function dropBall(to, dur = 0.5) {
    const s = ball.position.clone();
    await tween(dur, (t) => {
      ball.position.x = lerp(s.x, to.x, t); ball.position.z = lerp(s.z, to.z, t);
      ball.position.y = Math.max(BALL_R, lerp(s.y, BALL_R, t) + Math.abs(Math.sin(t * Math.PI * 2)) * (1 - t) * 0.8);
    }, ease.out);
  }

  // ---------- מצלמה ----------
  function camFor(v) {
    const a = camera.aspect;
    const back = a < 1 ? clamp(1.35 / a, 1.35, 2.1) : a < 1.4 ? 1.15 : 1;
    if (v === 'attack') return { pos: new T.Vector3(0.4, 3.0 + (back - 1) * 1.6, -19.8 + (back - 1) * 6), look: new T.Vector3(0, 0.9, -40) };
    if (v === 'defense') return { pos: new T.Vector3(0, 6.2 + (back - 1) * 2, 51.5 + (back - 1) * 7), look: new T.Vector3(0, a < 1 ? -5 : -0.4, 27) };
    if (v === 'celebrate') return { pos: new T.Vector3(5.5, 2.4, -21), look: new T.Vector3(-0.4, 1.4, -28) };
    return { pos: new T.Vector3(0, 9, 26), look: new T.Vector3(0, 1.5, 0) };
  }
  function setView(v, dur = 0.9) {
    view = v;
    if (v === 'menu') return Promise.resolve();
    const from = { pos: camCur.pos.clone(), look: camCur.look.clone() };
    const to = camFor(v);
    if (dur <= 0) { camCur.pos.copy(to.pos); camCur.look.copy(to.look); return Promise.resolve(); }
    return tween(dur, (t) => { camCur.pos.lerpVectors(from.pos, to.pos, t); camCur.look.lerpVectors(from.look, to.look, t); });
  }

  // ---------- רצפים שהמשחק מפעיל ----------
  const RAY_SPOT = { x: -1.3, z: -27.2 }, BALL_SPOT = { x: 0, z: -29 };
  const SKY_SPOT = { x: 6.5, z: -25.5 };

  function attackSetup() {
    place(hero, RAY_SPOT.x, RAY_SPOT.z, Math.PI);
    ballAt(BALL_SPOT.x, BALL_SPOT.z);
    place(keeper, 0, ATK_Z + 0.6, 0);
    keeper.visible = true;
    place(sky, SKY_SPOT.x, SKY_SPOT.z, -Math.PI * 0.6);
    place(berti, 0, OWN_Z - 0.8, Math.PI);
    place(striker, -6, -8, Math.PI);
    return setView('attack');
  }

  function charge(on) {
    const target = on ? 0.55 : 0;
    const s = ballGlow.material.opacity;
    return tween(0.25, (t) => (ballGlow.material.opacity = lerp(s, target, t)));
  }

  // הפיכת נגיעה במסך לנקודה בתוך השער (מישור z=ATK_Z)
  const ray3 = new T.Raycaster();
  function screenToGoal(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    const v = new T.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray3.setFromCamera(v, camera);
    const o = ray3.ray.origin, d = ray3.ray.direction;
    if (Math.abs(d.z) < 1e-4) return { x: 0, y: 1.2 };
    const k = (ATK_Z - o.z) / d.z;
    return { x: clamp(o.x + d.x * k, -GW / 2 + 0.5, GW / 2 - 0.5), y: clamp(o.y + d.y * k, 0.35, GH - 0.35) };
  }
  // נקודה בשער ← מיקום במסך (לסימון יעד)
  function goalToScreen(x, y, z = ATK_Z) {
    const v = new T.Vector3(x, y, z).project(camera);
    const r = renderer.domElement.getBoundingClientRect();
    return { x: r.left + ((v.x + 1) / 2) * r.width, y: r.top + ((1 - v.y) / 2) * r.height };
  }

  // outcome: 'goal' | 'save' | 'post'. power: 1 רגיל, 2 בעיטת על. curve: לחש ווינגרדיום
  async function shoot({ tx, ty, outcome, power = 1, curve = false }) {
    await runTo(hero, BALL_SPOT.x - 0.35, BALL_SPOT.z + 0.75, 0.22, true);
    kickAnim(hero);
    await wait(0.2);
    fx('kick', power);
    const dur = power > 1 ? 0.42 : 0.6;
    const side = Math.sign(tx) || 1;
    if (outcome === 'post') { tx = side * (GW / 2); ty = clamp(ty, 0.6, GH - 0.4); }
    const end = new T.Vector3(tx, ty, ATK_Z + (outcome === 'save' ? 0.4 : 0));
    const keeperTarget = outcome === 'save' ? tx : outcome === 'goal' ? -side * rand(1.4, 2.6) : side * 1.2;
    divePerson(keeper, keeperTarget, outcome === 'save' ? ty : 0.8, dur * 1.05, 0.95);
    const trail = setInterval(() => !paused && burst(ball.position.clone(), power > 1 ? [0xffd35a, 0xfff1a8] : [0xffffff], 2, 1.2), 40);
    await flyBall(end, dur, { arc: 0.4 + ty * 0.25, curve: curve ? -side * 3.2 : 0 });
    clearInterval(trail);
    if (outcome === 'goal') {
      fx('net');
      bulge('atk');
      await flyBall(new T.Vector3(tx * 0.9, Math.max(BALL_R, ty * 0.6), ATK_Z - GD + 0.35), 0.18, { arc: 0 });
      dropBall(new T.Vector3(tx * 0.8, 0, ATK_Z - GD + 0.5), 0.6);
      burst(new T.Vector3(0, GH, ATK_Z), [HOUSES[house.home].main, HOUSES[house.home].trim, 0xffffff], 70, 9);
    } else if (outcome === 'save') {
      fx('save');
      holdBall(keeper);
      await wait(0.25);
      freeBall();
      await flyBall(new T.Vector3(side * rand(5, 9), BALL_R, ATK_Z + rand(5, 9)), 0.7, { arc: 2 });
    } else {
      fx('post');
      await flyBall(new T.Vector3(side * 8, BALL_R, ATK_Z + 6), 0.65, { arc: 1.5 });
    }
    recoverPerson(keeper, 0);
  }

  async function celebrateGoal() {
    fx('crowd');
    crowdJump();
    sky.userData.wag = true;
    await Promise.all([cheer(hero, 3), dogHop(sky, 3), setView('celebrate', 0.6)]);
  }

  async function fumble() {
    await runTo(hero, BALL_SPOT.x - 0.35, BALL_SPOT.z + 0.75, 0.22, true);
    kickAnim(hero);
    await wait(0.18);
    fx('fumble');
    const stop = { x: 3.4, z: -32.5 };
    await dropBall(new T.Vector3(stop.x, 0, stop.z), 0.9);
    fx('bark');
    sky.userData.wag = true;
    await runTo(sky, stop.x + 0.2, stop.z + 1.2, 0.55);
    holdBall(sky);
    await runTo(sky, BALL_SPOT.x + 1.1, BALL_SPOT.z + 0.4, 0.6);
    freeBall();
    await dropBall(new T.Vector3(BALL_SPOT.x, 0, BALL_SPOT.z), 0.25);
    fx('bark');
    await dogHop(sky, 1);
    sky.userData.wag = false;
    runTo(sky, SKY_SPOT.x, SKY_SPOT.z, 0.6).then(() => faceTo(sky, 0, -32));
  }

  async function defenseSetup() {
    keeper.visible = false;
    place(berti, 0, OWN_Z - 0.8, Math.PI);
    place(sky, 7.5, OWN_Z - 6, -Math.PI * 0.7);
    place(hero, -7, 22, Math.PI * 0.85);
    const sx = rand(-6, 6), ex = rand(-1.5, 1.5);
    place(striker, sx, 16, 0);
    ballAt(sx, 17);
    holdBall({ follow: striker, ahead: 1.1 });
    await setView('defense', 0.8);
    await runTo(striker, ex, OWN_Z - 11.2, 1.5);
    freeBall();
    ball.position.set(ex, BALL_R, OWN_Z - 10);
  }

  // outcome: 'save' | 'clear' | 'goal' | 'post'
  async function oppShoot(outcome) {
    const side = Math.random() < 0.5 ? -1 : 1;
    let tx = side * rand(1.4, 3.1), ty = rand(0.4, 1.9);
    if (outcome === 'post') { tx = side * (GW / 2); ty = rand(0.8, 2); }
    kickAnim(striker);
    await wait(0.2);
    fx('kick', 1);
    const dur = 0.6;
    const bu = berti.userData;
    const sx = berti.position.x;
    const diveX = outcome === 'goal' ? -side * 2 : outcome === 'post' ? side * 1 : tx;
    const roll = tiltFor(berti, diveX - sx) * 0.7;
    bu.wag = true;
    const dive = tween(dur * 1.05, (t) => {
      berti.position.x = lerp(sx, diveX, t);
      berti.position.y = Math.sin(t * Math.PI * 0.85) * clamp(ty * 0.7, 0.2, 1.6);
      berti.rotation.z = roll * t;
      bu.jaw.position.y = -0.27 - t * 0.08;
    }, ease.out);
    const end = new T.Vector3(tx, ty, OWN_Z - (outcome === 'save' || outcome === 'clear' ? 0.9 : 0));
    await flyBall(end, dur, { arc: 0.5 });
    await dive;
    if (outcome === 'save' || outcome === 'clear') {
      fx('save'); fx('bark');
      holdBall(berti);
      await tween(0.4, (t) => { berti.position.y = lerp(berti.position.y, 0, t); berti.rotation.z = lerp(berti.rotation.z, 0, t); });
      burst(berti.position.clone().setY(1.5), [HOUSES[house.home].main, HOUSES[house.home].trim, 0xffffff], 50, 7);
      dogHop(berti, 2);
      if (outcome === 'clear') {
        await wait(0.35);
        freeBall();
        fx('kick', 2);
        await flyBall(new T.Vector3(rand(-8, 8), BALL_R, rand(-5, 5)), 1.0, { arc: 9 });
      } else {
        await wait(0.6);
      }
    } else if (outcome === 'goal') {
      fx('net');
      bulge('own');
      await flyBall(new T.Vector3(tx * 0.9, Math.max(BALL_R, ty * 0.6), OWN_Z + GD - 0.35), 0.18, { arc: 0 });
      dropBall(new T.Vector3(tx * 0.8, 0, OWN_Z + GD - 0.5), 0.6);
      await tween(0.4, (t) => { berti.position.y = lerp(berti.position.y, 0, t); berti.rotation.z = lerp(berti.rotation.z, 0, t); });
      cheer(striker, 1);
      await wait(0.5);
    } else {
      fx('post');
      await flyBall(new T.Vector3(side * 8, BALL_R, OWN_Z - 6), 0.65, { arc: 1.5 });
      await tween(0.4, (t) => { berti.position.y = lerp(berti.position.y, 0, t); berti.rotation.z = lerp(berti.rotation.z, 0, t); });
    }
    bu.jaw.position.y = -0.27;
    bu.wag = false;
    berti.rotation.z = 0;
  }

  function crowdJump() {
    tween(1.2, (t) => (crowd.position.y = Math.abs(Math.sin(t * Math.PI * 4)) * 0.35 * (1 - t)), ease.lin);
  }

  function menuSetup() {
    view = 'menu';
    keeper.visible = false;
    place(hero, 0, 0, 0);
    place(berti, -2.4, 0.6, 0.35);
    place(sky, 2.2, 0.8, -0.35);
    place(striker, -40, -60, 0);
    ballAt(0, 0.6, 2.9);
  }

  function endSetup() {
    view = 'end';
    keeper.visible = false;
    place(hero, 0, 0, 0);
    place(berti, -2.4, 0.5, 0.3);
    place(sky, 2.2, 0.6, -0.3);
    ballAt(0.9, 1.2);
    setView('end-cam', 0);
    camCur.pos.set(0, 2.6, 8.5); camCur.look.set(0, 1.4, 0);
    cheer(hero, 4); dogHop(berti, 3); dogHop(sky, 3);
    burst(new T.Vector3(0, 4, 0), [HOUSES[house.home].main, HOUSES[house.home].trim, 0xffffff, 0xffd35a], 90, 8);
  }

  // ---------- לולאה ----------
  let last = 0;
  const SPEEDUP = Number(new URLSearchParams(location.search).get('speed')) || 1; // לבדיקות אוטומטיות
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0) * SPEEDUP;
    last = now;
    if (!paused) {
      clockT += dt;
      stepTweens(dt);
      stepParts(dt);
    }
    const h = ballState.holder;
    if (h) {
      if (h.follow) {
        const f = h.follow;
        ball.position.set(f.position.x + Math.sin(f.rotation.y) * h.ahead, BALL_R, f.position.z + Math.cos(f.rotation.y) * h.ahead);
      } else if (h.userData.mouth) {
        h.userData.mouth.getWorldPosition(ball.position);
      } else {
        h.getWorldPosition(ball.position);
        ball.position.y += 1.6;
      }
    }
    if (view === 'menu' && !paused) {
      // השחקן מקפיץ את הכדור על הראש
      const k = (clockT * 1.6) % 1;
      ball.position.set(0, 2.9 + Math.sin(k * Math.PI) * 1.6, 0.05);
      if (k < 0.04) hero.userData.headP.rotation.x = -0.25; else hero.userData.headP.rotation.x *= 0.9;
      const a = Math.sin(clockT * 0.18) * 0.55;
      const r = camera.aspect < 1 ? 13 : 9.5;
      camCur.pos.set(Math.sin(a) * r, 2.2, Math.cos(a) * r);
      camCur.look.set(0, camera.aspect < 1 ? 2.3 : 1.15, 0);
    }
    [hero, keeper, striker, berti, sky].forEach((o) => o && !paused && animateLimbs(o, dt));
    if (view === 'defense' || view === 'attack') {
      if (keeper.visible && !keeper.userData.pose) keeper.position.x = Math.sin(clockT * 1.4) * 0.6;
    }
    candles.forEach((c) => (c.position.y += Math.sin(clockT * 1.3 + c.userData.ph) * 0.004));
    if (ballState.skin === 'snitch') ballWings.children.forEach((w, i) => (w.rotation.y = Math.sin(clockT * 40) * 0.6 * (i ? 1 : -1)));
    ballGlow.scale.setScalar(1 + Math.sin(clockT * 8) * 0.12);
    rollBall();
    blobs.forEach((b) => { b.m.position.set(b.obj.position.x, 0.02, b.obj.position.z); b.m.visible = b.obj.visible !== false; });
    camera.position.copy(camCur.pos);
    camera.lookAt(camCur.look);
    renderer.render(scene, camera);
  }

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 1 ? 62 : 52;
    camera.updateProjectionMatrix();
    if (view === 'attack' || view === 'defense') { const c = camFor(view); camCur.pos.copy(c.pos); camCur.look.copy(c.look); }
  }

  function init(el, fxFn) {
    container = el;
    fx = fxFn || fx;
    renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.domElement.style.cssText = 'width:100%;height:100%;display:block';
    el.appendChild(renderer.domElement);
    scene = new T.Scene();
    scene.background = new T.Color(0x8fcbff);
    scene.fog = new T.Fog(0xbfe2ff, 90, 260);
    camera = new T.PerspectiveCamera(52, 1, 0.1, 500);
    scene.add(new T.HemisphereLight(0xffffff, 0x4a7a3a, 0.7));
    const sun = new T.DirectionalLight(0xfff2d6, 0.75);
    sun.position.set(20, 40, 15);
    scene.add(sun);
    partGeo = new T.PlaneGeometry(0.22, 0.14);
    makeBallSkins();
    buildField();
    buildGoal(ATK_Z, 'atk');
    buildGoal(OWN_Z, 'own');
    crowd = buildStands();
    buildCastle();
    buildCandles();
    buildClouds();
    buildActors();
    makeBall();
    blobs.forEach((b) => scene.add(b.m));
    menuSetup();
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  }

  // צללים לדמויות שנבנות מחדש (השחקן אחרי החלפת תלבושת)
  function syncBlobs() { blobs.forEach((b) => { if (!b.m.parent) scene.add(b.m); }); }

  // ביטול כל האנימציות שבדרך (יציאה לתפריט באמצע משחק)
  function reset() {
    tweens.length = 0;
